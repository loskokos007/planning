<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Planning</title>

<style>
:root {
    --bg: #0b0b0b;
    --card: #151515;
    --card2: #1d1d1d;
    --border: #292929;
    --yellow: #ffe600;
    --yellow-dark: #c7b500;
    --white: #f5f5f5;
    --muted: #858585;
    --red: #ff4d4d;
    --green: #35d07f;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
}

body {
    background:
        radial-gradient(circle at top right, rgba(255,230,0,0.06), transparent 30%),
        var(--bg);
    color: var(--white);
    min-height: 100vh;
    padding: 20px;
}

.container {
    max-width: 1200px;
    margin: auto;
}

/* HEADER */

header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    padding-bottom: 20px;
    margin-bottom: 25px;
    border-bottom: 2px solid var(--yellow);
}

.logo {
    font-size: clamp(1.6rem, 5vw, 2.3rem);
    font-weight: 900;
    letter-spacing: 1px;
    text-transform: uppercase;
}

.logo span {
    color: var(--yellow);
}

.header-buttons {
    display: flex;
    gap: 8px;
}

button {
    cursor: pointer;
}

.btn {
    border: none;
    border-radius: 8px;
    padding: 11px 16px;
    font-weight: 800;
    background: var(--yellow);
    color: #000;
    transition: 0.2s;
}

.btn:hover {
    transform: translateY(-2px);
    background: var(--yellow-dark);
}

.btn.secondary {
    background: var(--card2);
    color: var(--white);
    border: 1px solid var(--border);
}

.icon-btn {
    width: 42px;
    height: 42px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--card2);
    color: var(--white);
    font-size: 18px;
}

.icon-btn:hover {
    border-color: var(--yellow);
    color: var(--yellow);
}

/* DASHBOARD */

.dashboard {
    display: grid;
    grid-template-columns: 1.1fr 2fr;
    gap: 20px;
}

.card {
    background: rgba(21,21,21,0.95);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
}

.card-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: var(--yellow);
    font-size: 1.15rem;
    font-weight: 800;
    margin-bottom: 18px;
}

/* CALENDAR */

.calendar-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

.month-title {
    font-size: 1.3rem;
    font-weight: 800;
}

.month-controls {
    display: flex;
    gap: 7px;
}

.weekdays,
.calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 7px;
}

.weekday {
    text-align: center;
    color: var(--muted);
    font-size: 0.75rem;
    font-weight: 800;
    padding-bottom: 5px;
}

.day {
    min-height: 65px;
    background: var(--card2);
    border: 1px solid transparent;
    border-radius: 9px;
    padding: 8px;
    cursor: pointer;
    transition: 0.2s;
    position: relative;
}

.day:hover {
    border-color: var(--yellow);
    transform: translateY(-2px);
}

.day.empty {
    background: transparent;
    cursor: default;
}

.day.today {
    border-color: var(--yellow);
}

.day.selected {
    background: rgba(255,230,0,0.14);
    border-color: var(--yellow);
}

.day-number {
    font-weight: 800;
    font-size: 0.9rem;
}

.task-dots {
    display: flex;
    gap: 3px;
    margin-top: 7px;
    flex-wrap: wrap;
}

.task-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--yellow);
}

.task-dot.done {
    background: var(--green);
}

.day-progress {
    position: absolute;
    bottom: 5px;
    left: 8px;
    right: 8px;
    height: 3px;
    background: #303030;
    border-radius: 5px;
    overflow: hidden;
}

.day-progress-fill {
    height: 100%;
    background: var(--yellow);
}

/* SELECTED DAY */

.selected-day-title {
    font-size: 1.25rem;
    font-weight: 800;
}

.selected-day-title span {
    color: var(--yellow);
}

.task-form {
    display: grid;
    grid-template-columns: 1fr 110px auto;
    gap: 8px;
    margin-bottom: 18px;
}

input {
    background: #222;
    border: 1px solid var(--border);
    color: white;
    border-radius: 8px;
    padding: 11px;
    outline: none;
}

input:focus {
    border-color: var(--yellow);
}

.task-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.task {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--card2);
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 11px;
}

.task.completed {
    opacity: 0.55;
}

.task.completed .task-name {
    text-decoration: line-through;
}

.check {
    width: 22px;
    height: 22px;
    border-radius: 6px;
    border: 2px solid #555;
    background: transparent;
    flex-shrink: 0;
}

.task.completed .check {
    background: var(--yellow);
    border-color: var(--yellow);
}

.task-info {
    flex: 1;
    min-width: 0;
}

.task-name {
    font-weight: 700;
    overflow-wrap: anywhere;
}

.task-time {
    color: var(--muted);
    font-size: 0.75rem;
    margin-top: 2px;
}

.delete-task {
    border: none;
    background: transparent;
    color: var(--red);
    font-size: 17px;
}

/* STATS */

.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-top: 15px;
}

.stat {
    background: var(--card2);
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 13px;
    text-align: center;
}

.stat-value {
    color: var(--yellow);
    font-size: 1.35rem;
    font-weight: 900;
}

.stat-label {
    color: var(--muted);
    font-size: 0.7rem;
    margin-top: 3px;
}

.progress-container {
    margin-top: 15px;
}

.progress-info {
    display: flex;
    justify-content: space-between;
    font-size: 0.8rem;
    color: var(--muted);
    margin-bottom: 6px;
}

.progress {
    height: 8px;
    background: #292929;
    border-radius: 10px;
    overflow: hidden;
}

.progress-fill {
    height: 100%;
    width: 0%;
    background: var(--yellow);
    transition: width 0.3s;
}

/* EMPTY */

.empty {
    text-align: center;
    color: var(--muted);
    padding: 25px 10px;
}

.empty strong {
    display: block;
    color: var(--white);
    margin-bottom: 5px;
}

/* RESPONSIVE */

@media (max-width: 900px) {
    .dashboard {
        grid-template-columns: 1fr;
    }
}

@media (max-width: 600px) {

    body {
        padding: 12px;
    }

    header {
        align-items: flex-start;
    }

    .header-buttons .btn {
        padding: 9px 10px;
        font-size: 0.7rem;
    }

    .card {
        padding: 14px;
    }

    .day {
        min-height: 52px;
        padding: 6px;
    }

    .day-number {
        font-size: 0.75rem;
    }

    .task-form {
        grid-template-columns: 1fr 90px;
    }

    .task-form button {
        grid-column: span 2;
    }

    .stats {
        grid-template-columns: 1fr 1fr 1fr;
    }

    .stat {
        padding: 10px 5px;
    }

    .stat-value {
        font-size: 1.1rem;
    }

    .stat-label {
        font-size: 0.6rem;
    }
}
</style>
</head>

<body>

<div class="container">

<header>
    <div class="logo">
        My <span>Planning</span>
    </div>

    <div class="header-buttons">
        <button class="btn" id="todayBtn">Aujourd'hui</button>
    </div>
</header>

<div class="dashboard">

    <!-- CALENDRIER -->
    <div class="card">

        <div class="calendar-header">

            <div class="month-title" id="monthTitle"></div>

            <div class="month-controls">
                <button class="icon-btn" id="prevMonth">‹</button>
                <button class="icon-btn" id="nextMonth">›</button>
            </div>

        </div>

        <div class="weekdays">
            <div class="weekday">LUN</div>
            <div class="weekday">MAR</div>
            <div class="weekday">MER</div>
            <div class="weekday">JEU</div>
            <div class="weekday">VEN</div>
            <div class="weekday">SAM</div>
            <div class="weekday">DIM</div>
        </div>

        <div class="calendar-grid" id="calendar"></div>

        <div class="stats">

            <div class="stat">
                <div class="stat-value" id="totalTasks">0</div>
                <div class="stat-label">TÂCHES</div>
            </div>

            <div class="stat">
                <div class="stat-value" id="completedTasks">0</div>
                <div class="stat-label">TERMINÉES</div>
            </div>

            <div class="stat">
                <div class="stat-value" id="streak">0</div>
                <div class="stat-label">🔥 SÉRIE</div>
            </div>

        </div>

        <div class="progress-container">

            <div class="progress-info">
                <span>Progression du mois</span>
                <span id="monthPercentage">0%</span>
            </div>

            <div class="progress">
                <div class="progress-fill" id="monthProgress"></div>
            </div>

        </div>

    </div>


    <!-- TACHES DU JOUR -->
    <div class="card">

        <div class="card-title">

            <div class="selected-day-title">
                Planning du <span id="selectedDateText">jour</span>
            </div>

        </div>

        <form class="task-form" id="taskForm">

            <input
                type="text"
                id="taskInput"
                placeholder="Ajouter une tâche..."
                maxlength="100"
                required
            >

            <input
                type="time"
                id="taskTime"
            >

            <button class="btn" type="submit">
                Ajouter
            </button>

        </form>

        <div class="task-list" id="taskList"></div>

    </div>

</div>

</div>


<script>

/* =========================
   DONNÉES
========================= */

let tasks = JSON.parse(localStorage.getItem("planningTasks")) || {};

let currentDate = new Date();

let selectedDate = new Date();


/* =========================
   ÉLÉMENTS
========================= */

const calendar = document.getElementById("calendar");

const monthTitle = document.getElementById("monthTitle");

const taskForm = document.getElementById("taskForm");

const taskInput = document.getElementById("taskInput");

const taskTime = document.getElementById("taskTime");

const taskList = document.getElementById("taskList");

const selectedDateText = document.getElementById("selectedDateText");

const totalTasks = document.getElementById("totalTasks");

const completedTasks = document.getElementById("completedTasks");

const streak = document.getElementById("streak");

const monthPercentage = document.getElementById("monthPercentage");

const monthProgress = document.getElementById("monthProgress");


/* =========================
   UTILITAIRES
========================= */

function dateKey(date) {

    return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2,"0")}-${String(date.getDate()).padStart(2,"0")}`;

}


function formatDate(date) {

    return date.toLocaleDateString("fr-FR", {
        weekday: "long",
        day: "numeric",
        month: "long"
    });

}


function save() {

    localStorage.setItem(
        "planningTasks",
        JSON.stringify(tasks)
    );

}


/* =========================
   CALENDRIER
========================= */

function renderCalendar() {

    calendar.innerHTML = "";

    const year = currentDate.getFullYear();

    const month = currentDate.getMonth();

    const monthNames = [
        "Janvier",
        "Février",
        "Mars",
        "Avril",
        "Mai",
        "Juin",
        "Juillet",
        "Août",
        "Septembre",
        "Octobre",
        "Novembre",
        "Décembre"
    ];

    monthTitle.textContent =
        `${monthNames[month]} ${year}`;


    let firstDay =
        new Date(year, month, 1).getDay();

    firstDay =
        firstDay === 0 ? 6 : firstDay - 1;


    const daysInMonth =
        new Date(year, month + 1, 0).getDate();


    for (let i = 0; i < firstDay; i++) {

        const empty = document.createElement("div");

        empty.className = "day empty";

        calendar.appendChild(empty);

    }


    const todayKey = dateKey(new Date());


    for (let day = 1; day <= daysInMonth; day++) {

        const date = new Date(year, month, day);

        const key = dateKey(date);

        const cell = document.createElement("div");

        cell.className = "day";


        if (key === todayKey) {
            cell.classList.add("today");
        }

        if (key === dateKey(selectedDate)) {
            cell.classList.add("selected");
        }


        const number = document.createElement("div");

        number.className = "day-number";

        number.textContent = day;

        cell.appendChild(number);


        const dayTasks = tasks[key] || [];

        const dots = document.createElement("div");

        dots.className = "task-dots";


        dayTasks.slice(0, 5).forEach(task => {

            const dot = document.createElement("div");

            dot.className = "task-dot";

            if (task.completed) {
                dot.classList.add("done");
            }

            dots.appendChild(dot);

        });


        cell.appendChild(dots);


        if (dayTasks.length > 0) {

            const done =
                dayTasks.filter(t => t.completed).length;

            const percentage =
                (done / dayTasks.length) * 100;


            const progress =
                document.createElement("div");

            progress.className = "day-progress";


            const fill =
                document.createElement("div");

            fill.className = "day-progress-fill";

            fill.style.width = percentage + "%";


            progress.appendChild(fill);

            cell.appendChild(progress);

        }


        cell.addEventListener("click", () => {

            selectedDate = new Date(date);

            renderCalendar();

            renderTasks();

        });


        calendar.appendChild(cell);

    }

}


/* =========================
   TACHES
========================= */

function renderTasks() {

    const key = dateKey(selectedDate);

    const dayTasks = tasks[key] || [];

    selectedDateText.textContent =
        formatDate(selectedDate);


    taskList.innerHTML = "";


    if (dayTasks.length === 0) {

        const empty = document.createElement("div");

        empty.className = "empty";

        const strong = document.createElement("strong");

        strong.textContent = "Aucune tâche";

        const text = document.createElement("span");

        text.textContent =
            "Ajoute quelque chose à faire aujourd'hui.";

        empty.appendChild(strong);

        empty.appendChild(text);

        taskList.appendChild(empty);

        return;

    }


    dayTasks
        .sort((a,b) => {

            if (!a.time) return 1;

            if (!b.time) return -1;

            return a.time.localeCompare(b.time);

        })
        .forEach(task => {

            const item =
                document.createElement("div");

            item.className = "task";

            if (task.completed) {
                item.classList.add("completed");
            }


            const check =
                document.createElement("button");

            check.className = "check";

            check.setAttribute(
                "aria-label",
                "Terminer la tâche"
            );


            check.addEventListener("click", () => {

                task.completed = !task.completed;

                save();

                renderTasks();

                renderCalendar();

                updateStats();

            });


            const info =
                document.createElement("div");

            info.className = "task-info";


            const name =
                document.createElement("div");

            name.className = "task-name";

            name.textContent = task.name;


            const time =
                document.createElement("div");

            time.className = "task-time";

            time.textContent =
                task.time
                ? "⏰ " + task.time
                : "Pas d'heure";


            info.appendChild(name);

            info.appendChild(time);


            const deleteBtn =
                document.createElement("button");

            deleteBtn.className =
                "delete-task";

            deleteBtn.textContent = "✕";


            deleteBtn.addEventListener("click", () => {

                tasks[key] =
                    tasks[key].filter(
                        t => t.id !== task.id
                    );


                if (tasks[key].length === 0) {
                    delete tasks[key];
                }


                save();

                renderTasks();

                renderCalendar();

                updateStats();

            });


            item.appendChild(check);

            item.appendChild(info);

            item.appendChild(deleteBtn);

            taskList.appendChild(item);

        });

}


/* =========================
   AJOUT TACHE
========================= */

taskForm.addEventListener("submit", event => {

    event.preventDefault();


    const name =
        taskInput.value.trim();

    const time =
        taskTime.value;


    if (!name) return;


    const key =
        dateKey(selectedDate);


    if (!tasks[key]) {
        tasks[key] = [];
    }


    tasks[key].push({

        id: Date.now(),

        name: name,

        time: time,

        completed: false

    });


    save();


    taskInput.value = "";

    taskTime.value = "";


    renderTasks();

    renderCalendar();

    updateStats();

});


/* =========================
   MOIS
========================= */

document
    .getElementById("prevMonth")
    .addEventListener("click", () => {

        currentDate.setMonth(
            currentDate.getMonth() - 1
        );

        renderCalendar();

        updateStats();

    });


document
    .getElementById("nextMonth")
    .addEventListener("click", () => {

        currentDate.setMonth(
            currentDate.getMonth() + 1
        );

        renderCalendar();

        updateStats();

    });


/* =========================
   AUJOURD'HUI
========================= */

document
    .getElementById("todayBtn")
    .addEventListener("click", () => {

        const today = new Date();

        currentDate = new Date(today);

        selectedDate = new Date(today);

        renderCalendar();

        renderTasks();

        updateStats();

    });


/* =========================
   STATISTIQUES
========================= */

function updateStats() {

    const year =
        currentDate.getFullYear();

    const month =
        currentDate.getMonth();

    const daysInMonth =
        new Date(year, month + 1, 0).getDate();


    let total = 0;

    let completed = 0;


    for (let day = 1; day <= daysInMonth; day++) {

        const key =
            `${year}-${String(month + 1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;

        const dayTasks =
            tasks[key] || [];


        total += dayTasks.length;

        completed +=
            dayTasks.filter(
                task => task.completed
            ).length;

    }


    totalTasks.textContent = total;

    completedTasks.textContent = completed;


    const percentage =
        total === 0
        ? 0
        : Math.round((completed / total) * 100);


    monthPercentage.textContent =
        percentage + "%";

    monthProgress.style.width =
        percentage + "%";


    updateStreak();

}


/* =========================
   STREAK
========================= */

function updateStreak() {

    let count = 0;

    const date = new Date();


    while (true) {

        const key = dateKey(date);

        const dayTasks =
            tasks[key] || [];


        if (
            dayTasks.length === 0 ||
            !dayTasks.every(
                task => task.completed
            )
        ) {
            break;
        }


        count++;

        date.setDate(
            date.getDate() - 1
        );

    }


    streak.textContent = count;

}


/* =========================
   INITIALISATION
========================= */

renderCalendar();

renderTasks();

updateStats();

</script>

</body>
</html>
