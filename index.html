<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mon Planning</title>
<style>
:root {
  --bg: #0f1117;
  --panel: #171a23;
  --panel2: #1e2230;
  --text: #f5f7fb;
  --muted: #9299aa;
  --accent: #7c5cff;
  --accent2: #6242e8;
  --border: #2a2f3d;
  --danger: #ff5c6c;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: radial-gradient(circle at top, #1a1730 0, var(--bg) 42%);
  color: var(--text);
}
.container { width: min(1100px, 94%); margin: 0 auto; padding: 35px 0 50px; }
header {
  display:flex; justify-content:space-between; align-items:center; gap:20px;
  margin-bottom:28px;
}
h1 { margin:0; font-size: clamp(28px, 5vw, 42px); }
.subtitle { color:var(--muted); margin-top:6px; }
.month-bar {
  display:flex; align-items:center; justify-content:space-between;
  background:rgba(23,26,35,.9); border:1px solid var(--border);
  border-radius:18px; padding:14px; margin-bottom:14px;
}
.month-title { font-size:22px; font-weight:700; text-transform:capitalize; }
button {
  border:0; cursor:pointer; color:var(--text); background:var(--panel2);
  padding:10px 14px; border-radius:11px; font-weight:600;
}
button:hover { background:#292e3d; }
.nav-btn { font-size:20px; width:44px; height:44px; padding:0; }
.today-btn { background:var(--accent); margin-left:8px; }
.today-btn:hover { background:var(--accent2); }

.calendar {
  display:grid; grid-template-columns:repeat(7,1fr); gap:7px;
}
.weekday {
  text-align:center; color:var(--muted); font-size:13px; font-weight:700;
  padding:8px 0;
}
.day {
  min-height:105px; padding:10px; background:var(--panel);
  border:1px solid var(--border); border-radius:14px; cursor:pointer;
  transition:.15s; position:relative; overflow:hidden;
}
.day:hover { transform:translateY(-1px); border-color:#41485a; }
.day.empty { background:transparent; border-color:transparent; cursor:default; }
.day.selected { border:2px solid var(--accent); padding:9px; }
.day.today .number {
  background:var(--accent); color:white; border-radius:8px; padding:3px 7px;
}
.number { font-weight:700; display:inline-block; }
.task-preview { margin-top:9px; display:flex; flex-direction:column; gap:4px; }
.preview {
  font-size:12px; color:#cbd0dc; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.preview.done { text-decoration:line-through; color:#747b8d; }
.more { color:var(--accent); font-size:11px; }
.dot {
  position:absolute; right:10px; top:13px; width:7px; height:7px;
  background:var(--accent); border-radius:50%;
}

.panel {
  margin-top:18px; background:rgba(23,26,35,.95);
  border:1px solid var(--border); border-radius:18px; padding:22px;
}
.panel-head { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:18px; }
.panel h2 { margin:0; font-size:21px; text-transform:capitalize; }
.add {
  background:var(--accent); padding:11px 15px;
}
.add:hover { background:var(--accent2); }
.task {
  display:flex; align-items:center; gap:12px; padding:13px 0;
  border-bottom:1px solid var(--border);
}
.task:last-child { border-bottom:0; }
.check {
  width:21px; height:21px; border-radius:6px; border:2px solid #596173;
  display:grid; place-items:center; flex:none; cursor:pointer;
}
.check.checked { background:var(--accent); border-color:var(--accent); }
.check.checked::after { content:"✓"; font-size:13px; font-weight:800; }
.task-text { flex:1; line-height:1.35; word-break:break-word; }
.task.done .task-text { text-decoration:line-through; color:#737b8e; }
.task-actions { display:flex; gap:6px; }
.small { padding:7px 9px; font-size:13px; }
.delete:hover { background:rgba(255,92,108,.15); color:var(--danger); }
.empty-state { color:var(--muted); text-align:center; padding:24px 0; }
.modal-bg {
  display:none; position:fixed; inset:0; background:rgba(0,0,0,.65);
  align-items:center; justify-content:center; padding:20px; z-index:10;
}
.modal-bg.open { display:flex; }
.modal {
  width:min(480px,100%); background:var(--panel); border:1px solid var(--border);
  border-radius:18px; padding:22px;
}
.modal h3 { margin:0 0 15px; }
input {
  width:100%; padding:13px; border-radius:11px; border:1px solid var(--border);
  background:#0f1219; color:var(--text); outline:none; font-size:15px;
}
input:focus { border-color:var(--accent); }
.modal-actions { display:flex; justify-content:flex-end; gap:9px; margin-top:15px; }
@media (max-width:700px) {
  .container { padding-top:22px; }
  .calendar { gap:4px; }
  .day { min-height:78px; padding:7px; border-radius:10px; }
  .day.selected { padding:6px; }
  .preview { font-size:10px; }
  .weekday { font-size:11px; }
  .panel { padding:16px; }
  header { display:block; }
}
</style>
</head>
<body>
<div class="container">
  <header>
    <div>
      <h1>Mon Planning</h1>
      <div class="subtitle">Organise tes journées simplement.</div>
    </div>
  </header>

  <div class="month-bar">
    <button class="nav-btn" id="prev">‹</button>
    <div>
      <span class="month-title" id="monthTitle"></span>
      <button class="today-btn" id="today">Aujourd’hui</button>
    </div>
    <button class="nav-btn" id="next">›</button>
  </div>

  <div class="calendar" id="calendar"></div>

  <section class="panel">
    <div class="panel-head">
      <h2 id="selectedTitle"></h2>
      <button class="add" id="addBtn">＋ Ajouter</button>
    </div>
    <div id="tasks"></div>
  </section>
</div>

<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h3 id="modalTitle">Ajouter une tâche</h3>
    <input id="taskInput" maxlength="180" placeholder="Ex. Réviser les maths">
    <div class="modal-actions">
      <button id="cancel">Annuler</button>
      <button class="add" id="save">Enregistrer</button>
    </div>
  </div>
</div>

<script>
const STORAGE = "mon-planning-taches-v1";
let data = JSON.parse(localStorage.getItem(STORAGE) || "{}");
let view = new Date();
let selected = new Date();
let editingId = null;

const months = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
const weekdays = ["Lun","Mar","Mer","Jeu","Ven","Sam","Dim"];

function key(date) {
  return date.getFullYear() + "-" +
    String(date.getMonth()+1).padStart(2,"0") + "-" +
    String(date.getDate()).padStart(2,"0");
}
function saveData() { localStorage.setItem(STORAGE, JSON.stringify(data)); }
function tasksFor(k) { return data[k] || []; }

function renderCalendar() {
  document.getElementById("monthTitle").textContent =
    months[view.getMonth()] + " " + view.getFullYear();

  const cal = document.getElementById("calendar");
  cal.innerHTML = weekdays.map(d => `<div class="weekday">${d}</div>`).join("");

  const first = new Date(view.getFullYear(), view.getMonth(), 1);
  let start = (first.getDay() + 6) % 7;
  const total = new Date(view.getFullYear(), view.getMonth()+1, 0).getDate();

  for (let i=0; i<start; i++) cal.insertAdjacentHTML("beforeend", `<div class="day empty"></div>`);

  const todayKey = key(new Date());
  for (let d=1; d<=total; d++) {
    const date = new Date(view.getFullYear(), view.getMonth(), d);
    const k = key(date);
    const ts = tasksFor(k);
    const isSelected = k === key(selected);
    const isToday = k === todayKey;
    const previews = ts.slice(0,3).map(t =>
      `<div class="preview ${t.done ? "done":""}">${escapeHtml(t.text)}</div>`).join("");
    const more = ts.length > 3 ? `<div class="more">+${ts.length-3} autre(s)</div>` : "";
    cal.insertAdjacentHTML("beforeend", `
      <div class="day ${isSelected ? "selected":""} ${isToday ? "today":""}" data-date="${k}">
        <span class="number">${d}</span>
        ${ts.length ? '<span class="dot"></span>' : ''}
        <div class="task-preview">${previews}${more}</div>
      </div>`);
  }
  cal.querySelectorAll(".day:not(.empty)").forEach(el => {
    el.onclick = () => {
      const [y,m,d] = el.dataset.date.split("-").map(Number);
      selected = new Date(y,m-1,d);
      renderCalendar();
      renderTasks();
    };
  });
}

function renderTasks() {
  const k = key(selected);
  document.getElementById("selectedTitle").textContent =
    selected.toLocaleDateString("fr-FR", {weekday:"long", day:"numeric", month:"long"});
  const container = document.getElementById("tasks");
  const ts = tasksFor(k);

  if (!ts.length) {
    container.innerHTML = `<div class="empty-state">Aucune tâche pour cette journée.</div>`;
    return;
  }

  container.innerHTML = ts.map(t => `
    <div class="task ${t.done ? "done":""}">
      <div class="check ${t.done ? "checked":""}" data-action="toggle" data-id="${t.id}"></div>
      <div class="task-text">${escapeHtml(t.text)}</div>
      <div class="task-actions">
        <button class="small" data-action="edit" data-id="${t.id}">Modifier</button>
        <button class="small delete" data-action="delete" data-id="${t.id}">Supprimer</button>
      </div>
    </div>`).join("");

  container.querySelectorAll("[data-action]").forEach(el => {
    el.onclick = () => handleAction(el.dataset.action, el.dataset.id);
  });
}

function handleAction(action, id) {
  const k = key(selected);
  const ts = tasksFor(k);
  const index = ts.findIndex(t => String(t.id) === String(id));
  if (index < 0) return;

  if (action === "toggle") ts[index].done = !ts[index].done;
  if (action === "delete") ts.splice(index,1);
  if (action === "edit") openModal(ts[index]);

  if (action !== "edit") {
    data[k] = ts;
    saveData();
    renderCalendar();
    renderTasks();
  }
}

function openModal(task=null) {
  editingId = task ? task.id : null;
  document.getElementById("modalTitle").textContent = task ? "Modifier la tâche" : "Ajouter une tâche";
  document.getElementById("taskInput").value = task ? task.text : "";
  document.getElementById("modalBg").classList.add("open");
  setTimeout(() => document.getElementById("taskInput").focus(), 50);
}
function closeModal() {
  document.getElementById("modalBg").classList.remove("open");
  editingId = null;
}
function saveTask() {
  const input = document.getElementById("taskInput");
  const text = input.value.trim();
  if (!text) return;
  const k = key(selected);
  if (!data[k]) data[k] = [];

  if (editingId) {
    const t = data[k].find(x => String(x.id) === String(editingId));
    if (t) t.text = text;
  } else {
    data[k].push({id: Date.now(), text, done:false});
  }
  saveData();
  closeModal();
  renderCalendar();
  renderTasks();
}
function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
}

document.getElementById("prev").onclick = () => { view.setMonth(view.getMonth()-1); renderCalendar(); };
document.getElementById("next").onclick = () => { view.setMonth(view.getMonth()+1); renderCalendar(); };
document.getElementById("today").onclick = () => {
  view = new Date(); selected = new Date(); renderCalendar(); renderTasks();
};
document.getElementById("addBtn").onclick = () => openModal();
document.getElementById("cancel").onclick = closeModal;
document.getElementById("save").onclick = saveTask;
document.getElementById("taskInput").addEventListener("keydown", e => {
  if (e.key === "Enter") saveTask();
  if (e.key === "Escape") closeModal();
});
document.getElementById("modalBg").addEventListener("click", e => {
  if (e.target.id === "modalBg") closeModal();
});

renderCalendar();
renderTasks();
</script>
</body>
</html>
