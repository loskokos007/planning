<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Habits</title>
<style>
:root {
    --bg: #f4f3ef;
    --surface: #ffffff;
    --surface-soft: #f8f7f3;
    --text: #181817;
    --muted: #88877f;
    --border: #e7e5df;
    --accent: #5b55d9;
    --accent-soft: #ecebff;
    --accent-dark: #4540ae;
    --sport: #4e8cff;
    --study: #9567df;
    --health: #e56b7d;
    --personal: #d59b38;
    --work: #49a27a;
    --danger: #d95f68;
    --shadow:
        0 15px 45px rgba(25, 24, 20, .07);
    --radius: 22px;
}
/* =========================
   RESET
========================= */
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}
html {
    min-height: 100%;
}
body {
    min-height: 100vh;
    background:
        radial-gradient(
            circle at 85% 5%,
            rgba(91, 85, 217, .10),
            transparent 28%
        ),
        radial-gradient(
            circle at 5% 80%,
            rgba(91, 85, 217, .06),
            transparent 25%
        ),
        var(--bg);
    color: var(--text);
    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    -webkit-font-smoothing: antialiased;
}
button,
input,
select {
    font: inherit;
}
button {
    cursor: pointer;
}
/* =========================
   APP
========================= */
.app {
    width: min(1280px, calc(100% - 40px));
    margin: auto;
}
/* =========================
   HEADER
========================= */
header {
    height: 88px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
}
.logo {
    display: flex;
    align-items: center;
    gap: 12px;
}
.logo-mark {
    width: 40px;
    height: 40px;
    border-radius: 13px;
    background: var(--text);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    font-weight: 800;
}
.logo-text {
    font-size: 21px;
    font-weight: 800;
    letter-spacing: -.7px;
}
.logo-text span {
    color: var(--accent);
}
.header-date {
    color: var(--muted);
    font-size: 13px;
    font-weight: 600;
}
/* =========================
   MAIN
========================= */
main {
    padding: 35px 0 60px;
}
.layout {
    display: grid;
    grid-template-columns: minmax(0, 1.55fr) minmax(340px, .75fr);
    gap: 22px;
}
/* =========================
   CARDS
========================= */
.card {
    background: rgba(255,255,255,.86);
    border: 1px solid rgba(231,229,223,.9);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    backdrop-filter: blur(14px);
}
/* =========================
   CALENDAR
========================= */
.calendar-card {
    padding: 27px;
}
.calendar-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 27px;
}
.month-area {
    display: flex;
    align-items: center;
    gap: 9px;
}
.month-title {
    min-width: 185px;
    font-size: 24px;
    font-weight: 800;
    letter-spacing: -.8px;
}
.month-button {
    width: 36px;
    height: 36px;
    border-radius: 11px;
    border: 1px solid var(--border);
    background: white;
    color: var(--text);
    font-size: 20px;
    transition: .18s;
}
.month-button:hover {
    background: var(--accent-soft);
    color: var(--accent);
    border-color: #d4d1ff;
}
.today-button {
    border: none;
    background: var(--text);
    color: white;
    border-radius: 11px;
    padding: 10px 14px;
    font-size: 12px;
    font-weight: 700;
    transition: .18s;
}
.today-button:hover {
    transform: translateY(-1px);
    opacity: .9;
}
/* =========================
   WEEK
========================= */
.weekdays,
.calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 7px;
}
.weekdays {
    margin-bottom: 8px;
}
.weekday {
    text-align: center;
    color: var(--muted);
    font-size: 10px;
    font-weight: 800;
    letter-spacing: .5px;
}
/* =========================
   DAYS
========================= */
.day {
    position: relative;
    min-height: 92px;
    padding: 10px;
    background: var(--surface-soft);
    border: 1px solid transparent;
    border-radius: 14px;
    cursor: pointer;
    transition:
        transform .18s,
        background .18s,
        border .18s;
}
.day:hover {
    transform: translateY(-2px);
    background: white;
    border-color: #dcd9d2;
}
.day.empty {
    background: transparent;
    cursor: default;
}
.day-number {
    display: inline-flex;
    width: 27px;
    height: 27px;
    align-items: center;
    justify-content: center;
    border-radius: 9px;
    font-size: 12px;
    font-weight: 800;
}
.day.today .day-number {
    background: var(--text);
    color: white;
}
.day.selected {
    border-color: var(--accent);
    background: var(--accent-soft);
}
.day.selected .day-number {
    background: var(--accent);
    color: white;
}
/* =========================
   TASK INDICATORS
========================= */
.day-tasks {
    display: flex;
    flex-direction: column;
    gap: 4px;
    margin-top: 7px;
}
.day-task {
    display: flex;
    align-items: center;
    gap: 5px;
    min-width: 0;
    font-size: 9px;
    font-weight: 650;
    color: #66655f;
}
.task-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    flex-shrink: 0;
    background: var(--accent);
}
.day-task.completed {
    opacity: .42;
    text-decoration: line-through;
}
.more-tasks {
    color: var(--muted);
    font-size: 9px;
    font-weight: 700;
    margin-top: 2px;
}
/* =========================
   TASK PANEL
========================= */
.tasks-card {
    overflow: hidden;
}
.tasks-header {
    padding: 26px 25px 22px;
    background:
        linear-gradient(
            135deg,
            #191919,
            #292829
        );
    color: white;
}
.tasks-header-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
}
.tasks-day {
    font-size: 20px;
    font-weight: 800;
    letter-spacing: -.5px;
}
.tasks-count {
    padding: 6px 9px;
    border-radius: 9px;
    background: rgba(255,255,255,.1);
    color: rgba(255,255,255,.7);
    font-size: 10px;
    font-weight: 700;
}
.tasks-subtitle {
    margin-top: 5px;
    color: rgba(255,255,255,.52);
    font-size: 11px;
}
/* =========================
   ADD TASK
========================= */
.add-area {
    padding: 18px 20px 5px;
}
.task-input {
    width: 100%;
    padding: 12px 13px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: white;
    color: var(--text);
    outline: none;
    font-size: 13px;
    transition: .18s;
}
.task-input:focus {
    border-color: #aaa6ed;
    box-shadow:
        0 0 0 3px rgba(91,85,217,.08);
}
.task-options {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 7px;
    margin-top: 7px;
}
.option-input {
    width: 100%;
    border: 1px solid var(--border);
    background: white;
    border-radius: 10px;
    padding: 10px;
    color: var(--text);
    outline: none;
    font-size: 11px;
}
.add-button {
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: white;
    font-weight: 750;
    transition: .18s;
}
.add-button:hover {
    background: var(--accent-dark);
    transform: translateY(-1px);
}
/* =========================
   TASK LIST
========================= */
.tasks-list {
    padding: 14px 20px 20px;
    display: flex;
    flex-direction: column;
    gap: 7px;
    min-height: 350px;
}
.task {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 11px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: white;
    transition: .18s;
}
.task:hover {
    border-color: #d5d2cb;
    box-shadow:
        0 6px 18px rgba(25,24,20,.05);
}
.check {
    width: 22px;
    height: 22px;
    flex-shrink: 0;
    border-radius: 7px;
    border: 1.5px solid #bcbab3;
    background: white;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 900;
    transition: .18s;
}
.task.completed .check {
    background: var(--accent);
    border-color: var(--accent);
}
.task-info {
    flex: 1;
    min-width: 0;
}
.task-name {
    font-size: 12px;
    font-weight: 750;
    overflow-wrap: anywhere;
}
.task.completed .task-name {
    color: #aaa9a3;
    text-decoration: line-through;
}
.task-meta {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 4px;
    color: var(--muted);
    font-size: 9px;
}
.category {
    padding: 3px 7px;
    border-radius: 20px;
    font-weight: 750;
}
.category-sport {
    background: #e7f0ff;
    color: var(--sport);
}
.category-etudes {
    background: #f0e9ff;
    color: var(--study);
}
.category-sante {
    background: #ffe8ec;
    color: var(--health);
}
.category-personnel {
    background: #fff1d8;
    color: var(--personal);
}
.category-travail {
    background: #e5f5ed;
    color: var(--work);
}
.delete {
    border: none;
    background: transparent;
    color: #b3b1aa;
    font-size: 15px;
    padding: 4px;
    opacity: 0;
    transition: .18s;
}
.task:hover .delete {
    opacity: 1;
}
.delete:hover {
    color: var(--danger);
}
/* =========================
   EMPTY
========================= */
.empty {
    flex: 1;
    min-height: 280px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: var(--muted);
}
.empty-icon {
    width: 48px;
    height: 48px;
    border-radius: 15px;
    background: var(--accent-soft);
    color: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 11px;
    font-size: 18px;
}
.empty strong {
    color: var(--text);
    font-size: 12px;
}
.empty span {
    margin-top: 4px;
    font-size: 10px;
}
/* =========================
   FOOTER
========================= */
footer {
    padding: 20px 2px 30px;
    color: var(--muted);
    font-size: 10px;
    display: flex;
    justify-content: space-between;
}
/* =========================
   TABLET
========================= */
@media (max-width: 950px) {
    .layout {
        grid-template-columns: 1fr;
    }
    .tasks-list {
        min-height: 250px;
    }
}
/* =========================
   MOBILE
========================= */
@media (max-width: 650px) {
    .app {
        width: calc(100% - 18px);
    }
    header {
        height: 70px;
    }
    .header-date {
        display: none;
    }
    main {
        padding: 15px 0 35px;
    }
    .layout {
        gap: 13px;
    }
    .calendar-card {
        padding: 13px;
        border-radius: 18px;
    }
    .calendar-header {
        margin-bottom: 18px;
    }
    .month-title {
        min-width: 0;
        font-size: 18px;
    }
    .month-button {
        width: 32px;
        height: 32px;
    }
    .today-button {
        padding: 8px 10px;
        font-size: 10px;
    }
    .weekdays,
    .calendar-grid {
        gap: 4px;
    }
    .day {
        min-height: 62px;
        padding: 5px;
        border-radius: 10px;
    }
    .day-number {
        width: 23px;
        height: 23px;
        font-size: 10px;
    }
    .day-tasks {
        margin-top: 4px;
        gap: 2px;
    }
    .day-task {
        font-size: 7px;
    }
    .day-task .task-text {
        display: none;
    }
    .task-dot {
        width: 5px;
        height: 5px;
    }
    .more-tasks {
        font-size: 7px;
    }
    .tasks-header {
        padding: 20px;
    }
    .tasks-day {
        font-size: 18px;
    }
    .add-area {
        padding: 14px 15px 5px;
    }
    .tasks-list {
        padding: 10px 15px 15px;
    }
    .delete {
        opacity: 1;
    }
    footer {
        display: none;
    }
}
/* =========================
   VERY SMALL PHONES
========================= */
@media (max-width: 380px) {
    .app {
        width: calc(100% - 10px);
    }
    .day {
        min-height: 56px;
    }
    .today-button {
        display: none;
    }
    .calendar-card {
        padding: 9px;
    }
}
</style>
</head>
<body>
<div class="app">
<header>
    <div class="logo">
        <div class="logo-mark">H</div>
        <div class="logo-text">
            Habits<span>.</span>
        </div>
    </div>
    <div
        class="header-date"
        id="headerDate"
    ></div>
</header>
<main>
<div class="layout">
<!-- =========================
     CALENDAR
========================= -->
<section class="card calendar-card">
    <div class="calendar-header">
        <div class="month-area">
            <button
                class="month-button"
                id="previousMonth"
            >
                ‹
            </button>
            <div
                class="month-title"
                id="monthTitle"
            ></div>
            <button
                class="month-button"
                id="nextMonth"
            >
                ›
            </button>
        </div>
        <button
            class="today-button"
            id="todayButton"
        >
            Aujourd'hui
        </button>
    </div>
    <div class="weekdays">
        <div class="weekday">LUN</div>
        <div class="weekday">MAR</div>
        <div class="weekday">MER</div>
        <div class="weekday">JEU</div>
        <div class="weekday">VEN</div>
        <div class="weekday">SAM</div>
        <div class="weekday">DIM</div>
    </div>
    <div
        class="calendar-grid"
        id="calendar"
    ></div>
</section>
<!-- =========================
     TASKS
========================= -->
<section class="card tasks-card">
    <div class="tasks-header">
        <div class="tasks-header-top">
            <div
                class="tasks-day"
                id="selectedDate"
            ></div>
            <div
                class="tasks-count"
                id="tasksCount"
            >
                0 tâche
            </div>
        </div>
        <div class="tasks-subtitle">
            Organise ta journée.
        </div>
    </div>
    <div class="add-area">
        <form id="taskForm">
            <input
                class="task-input"
                id="taskInput"
                type="text"
                maxlength="100"
                placeholder="Ajouter une tâche..."
                autocomplete="off"
                required
            >
            <div class="task-options">
                <input
                    class="option-input"
                    id="taskTime"
                    type="time"
                >
                <select
                    class="option-input"
                    id="taskCategory"
                >
                    <option value="personnel">
                        Personnel
                    </option>
                    <option value="sport">
                        Sport
                    </option>
                    <option value="etudes">
                        Études
                    </option>
                    <option value="sante">
                        Santé
                    </option>
                    <option value="travail">
                        Travail
                    </option>
                </select>
            </div>
            <button
                class="add-button"
                type="submit"
                style="
                    width:100%;
                    height:40px;
                    margin-top:7px;
                "
            >
                Ajouter
            </button>
        </form>
    </div>
    <div
        class="tasks-list"
        id="tasksList"
    ></div>
</section>
</div>
</main>
<footer>
    <div>
        Habits.
    </div>
    <div>
        Tes tâches sont sauvegardées automatiquement.
    </div>
</footer>
</div>
<script>
/* ==========================================
   DATA
========================================== */
let tasks =
    JSON.parse(
        localStorage.getItem("habitsV2Tasks")
    ) || {};
let currentDate = new Date();
let selectedDate = new Date();
/* ==========================================
   CATEGORIES
========================================== */
const categories = {
    sport: {
        name: "Sport",
        icon: "🏃",
        color: "#4e8cff"
    },
    etudes: {
        name: "Études",
        icon: "📚",
        color: "#9567df"
    },
    sante: {
        name: "Santé",
        icon: "❤️",
        color: "#e56b7d"
    },
    personnel: {
        name: "Personnel",
        icon: "●",
        color: "#d59b38"
    },
    travail: {
        name: "Travail",
        icon: "💼",
        color: "#49a27a"
    }
};
/* ==========================================
   ELEMENTS
========================================== */
const calendar =
    document.getElementById("calendar");
const monthTitle =
    document.getElementById("monthTitle");
const selectedDateElement =
    document.getElementById("selectedDate");
const tasksList =
    document.getElementById("tasksList");
const tasksCount =
    document.getElementById("tasksCount");
const taskForm =
    document.getElementById("taskForm");
const taskInput =
    document.getElementById("taskInput");
const taskTime =
    document.getElementById("taskTime");
const taskCategory =
    document.getElementById("taskCategory");
const headerDate =
    document.getElementById("headerDate");
/* ==========================================
   UTILITIES
========================================== */
function getKey(date) {
    return [
        date.getFullYear(),
        String(
            date.getMonth() + 1
        ).padStart(2, "0"),
        String(
            date.getDate()
        ).padStart(2, "0")
    ].join("-");
}
function save() {
    localStorage.setItem(
        "habitsV2Tasks",
        JSON.stringify(tasks)
    );
}
function capitalize(text) {
    return text.charAt(0).toUpperCase()
        + text.slice(1);
}
function formatDate(date) {
    return date.toLocaleDateString(
        "fr-FR",
        {
            weekday: "long",
            day: "numeric",
            month: "long"
        }
    );
}
/* ==========================================
   HEADER DATE
========================================== */
function renderHeaderDate() {
    headerDate.textContent =
        new Date().toLocaleDateString(
            "fr-FR",
            {
                weekday: "long",
                day: "numeric",
                month: "long",
                year: "numeric"
            }
        );
}
/* ==========================================
   CALENDAR
========================================== */
function renderCalendar() {
    calendar.innerHTML = "";
    const year =
        currentDate.getFullYear();
    const month =
        currentDate.getMonth();
    const monthNames = [
        "Janvier",
        "Février",
        "Mars",
        "Avril",
        "Mai",
        "Juin",
        "Juillet",
        "Août",
        "Septembre",
        "Octobre",
        "Novembre",
        "Décembre"
    ];
    monthTitle.textContent =
        `${monthNames[month]} ${year}`;
    let firstDay =
        new Date(
            year,
            month,
            1
        ).getDay();
    firstDay =
        firstDay === 0
            ? 6
            : firstDay - 1;
    const daysInMonth =
        new Date(
            year,
            month + 1,
            0
        ).getDate();
    /* Empty cells */
    for (
        let i = 0;
        i < firstDay;
        i++
    ) {
        const empty =
            document.createElement("div");
        empty.className =
            "day empty";
        calendar.appendChild(empty);
    }
    const todayKey =
        getKey(new Date());
    /* Days */
    for (
        let day = 1;
        day <= daysInMonth;
        day++
    ) {
        const date =
            new Date(
                year,
                month,
                day
            );
        const key =
            getKey(date);
        const cell =
            document.createElement("div");
        cell.className =
            "day";
        if (key === todayKey) {
            cell.classList.add("today");
        }
        if (
            key ===
            getKey(selectedDate)
        ) {
            cell.classList.add("selected");
        }
        const number =
            document.createElement("div");
        number.className =
            "day-number";
        number.textContent =
            day;
        cell.appendChild(number);
        const dayTasks =
            tasks[key] || [];
        if (dayTasks.length) {
            const taskContainer =
                document.createElement("div");
            taskContainer.className =
                "day-tasks";
            dayTasks
                .slice(0, 3)
                .forEach(task => {
                    const row =
                        document.createElement("div");
                    row.className =
                        "day-task";
                    if (task.completed) {
                        row.classList.add(
                            "completed"
                        );
                    }
                    const dot =
                        document.createElement("div");
                    dot.className =
                        "task-dot";
                    const category =
                        categories[
                            task.category
                        ];
                    if (category) {
                        dot.style.background =
                            category.color;
                    }
                    const text =
                        document.createElement("span");
                    text.className =
                        "task-text";
                    text.textContent =
                        task.name;
                    row.appendChild(dot);
                    row.appendChild(text);
                    taskContainer.appendChild(row);
                });
            if (dayTasks.length > 3) {
                const more =
                    document.createElement("div");
                more.className =
                    "more-tasks";
                more.textContent =
                    `+${dayTasks.length - 3}`;
                taskContainer.appendChild(more);
            }
            cell.appendChild(
                taskContainer
            );
        }
        cell.addEventListener(
            "click",
            () => {
                selectedDate =
                    new Date(date);
                renderCalendar();
                renderTasks();
            }
        );
        calendar.appendChild(cell);
    }
}
/* ==========================================
   TASKS
========================================== */
function renderTasks() {
    const key =
        getKey(selectedDate);
    const dayTasks =
        tasks[key] || [];
    selectedDateElement.textContent =
        capitalize(
            formatDate(selectedDate)
        );
    tasksCount.textContent =
        `${dayTasks.length} ${
            dayTasks.length === 1
                ? "tâche"
                : "tâches"
        }`;
    tasksList.innerHTML = "";
    if (!dayTasks.length) {
        const empty =
            document.createElement("div");
        empty.className =
            "empty";
        const icon =
            document.createElement("div");
        icon.className =
            "empty-icon";
        icon.textContent =
            "＋";
        const title =
            document.createElement("strong");
        title.textContent =
            "Journée libre";
        const description =
            document.createElement("span");
        description.textContent =
            "Ajoute ta première tâche.";
        empty.appendChild(icon);
        empty.appendChild(title);
        empty.appendChild(description);
        tasksList.appendChild(empty);
        return;
    }
    const sortedTasks =
        [...dayTasks].sort(
            (a, b) => {
                if (!a.time) return 1;
                if (!b.time) return -1;
                return a.time.localeCompare(
                    b.time
                );
            }
        );
    sortedTasks.forEach(task => {
        const item =
            document.createElement("div");
        item.className =
            "task";
        if (task.completed) {
            item.classList.add(
                "completed"
            );
        }
        /* CHECK */
        const check =
            document.createElement("button");
        check.className =
            "check";
        check.textContent =
            task.completed
                ? "✓"
                : "";
        check.addEventListener(
            "click",
            () => {
                task.completed =
                    !task.completed;
                save();
                renderTasks();
                renderCalendar();
            }
        );
        /* INFO */
        const info =
            document.createElement("div");
        info.className =
            "task-info";
        const name =
            document.createElement("div");
        name.className =
            "task-name";
        name.textContent =
            task.name;
        const meta =
            document.createElement("div");
        meta.className =
            "task-meta";
        if (task.time) {
            const time =
                document.createElement("span");
            time.textContent =
                "◷ " + task.time;
            meta.appendChild(time);
        }
        const category =
            categories[
                task.category
            ] ||
            categories.personnel;
        const badge =
            document.createElement("span");
        badge.className =
            `category category-${task.category || "personnel"}`;
        badge.textContent =
            `${category.icon} ${category.name}`;
        meta.appendChild(badge);
        info.appendChild(name);
        info.appendChild(meta);
        /* DELETE */
        const deleteButton =
            document.createElement("button");
        deleteButton.className =
            "delete";
        deleteButton.textContent =
            "×";
        deleteButton.addEventListener(
            "click",
            () => {
                tasks[key] =
                    tasks[key].filter(
                        item =>
                            item.id !== task.id
                    );
                if (!tasks[key].length) {
                    delete tasks[key];
                }
                save();
                renderTasks();
                renderCalendar();
            }
        );
        item.appendChild(check);
        item.appendChild(info);
        item.appendChild(deleteButton);
        tasksList.appendChild(item);
    });
}
/* ==========================================
   ADD TASK
========================================== */
taskForm.addEventListener(
    "submit",
    event => {
        event.preventDefault();
        const name =
            taskInput.value.trim();
        if (!name) return;
        const key =
            getKey(selectedDate);
        if (!tasks[key]) {
            tasks[key] = [];
        }
        tasks[key].push({
            id: Date.now(),
            name: name,
            time: taskTime.value,
            category:
                taskCategory.value,
            completed: false
        });
        save();
        taskInput.value = "";
        taskTime.value = "";
        renderTasks();
        renderCalendar();
        taskInput.focus();
    }
);
/* ==========================================
   MONTH NAVIGATION
========================================== */
document
    .getElementById("previousMonth")
    .addEventListener(
        "click",
        () => {
            currentDate.setMonth(
                currentDate.getMonth() - 1
            );
            renderCalendar();
        }
    );
document
    .getElementById("nextMonth")
    .addEventListener(
        "click",
        () => {
            currentDate.setMonth(
                currentDate.getMonth() + 1
            );
            renderCalendar();
        }
    );
/* ==========================================
   TODAY
========================================== */
document
    .getElementById("todayButton")
    .addEventListener(
        "click",
        () => {
            const today =
                new Date();
            currentDate =
                new Date(today);
            selectedDate =
                new Date(today);
            renderCalendar();
            renderTasks();
        }
    );
/* ==========================================
   START
========================================== */
renderHeaderDate();
renderCalendar();
renderTasks();
</script>
