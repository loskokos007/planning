<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Habits.</title>

<style>
:root {
    --bg: #f3f1ec;
    --surface: #ffffff;
    --surface-2: #f8f7f3;
    --text: #171717;
    --muted: #8b8982;
    --border: #e5e2da;

    --accent: #635bdf;
    --accent-light: #eceaff;
    --accent-dark: #4d46bd;

    --sport: #4d8df7;
    --study: #9669df;
    --health: #e66b7b;
    --personal: #d69a36;
    --work: #4ca477;

    --danger: #db5964;

    --shadow: 0 18px 55px rgba(25, 23, 18, .07);

    --radius: 24px;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    min-height: 100%;
}

body {
    min-height: 100vh;

    background:
        radial-gradient(
            circle at 85% 0%,
            rgba(99,91,223,.12),
            transparent 27%
        ),
        radial-gradient(
            circle at 0% 85%,
            rgba(99,91,223,.06),
            transparent 25%
        ),
        var(--bg);

    color: var(--text);

    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    -webkit-font-smoothing: antialiased;

    transition:
        background .3s,
        color .3s;
}

button,
input,
select,
textarea {
    font: inherit;
}

button {
    cursor: pointer;
}

button,
input,
select,
textarea {
    -webkit-tap-highlight-color: transparent;
}


/* =========================
   DARK MODE
========================= */

body.dark {
    --bg: #101011;
    --surface: #19191b;
    --surface-2: #202023;
    --text: #f3f2ee;
    --muted: #929199;
    --border: #2b2b2f;

    --accent: #817aff;
    --accent-light: #272542;
    --accent-dark: #6962e9;

    --shadow:
        0 18px 55px rgba(0,0,0,.25);
}

body.dark .card {
    background: rgba(25,25,27,.9);
}

body.dark .day {
    background: #1e1e21;
}

body.dark .day:hover {
    background: #26262a;
}

body.dark .day.selected {
    background: #292744;
}

body.dark .task {
    background: #202023;
}

body.dark .task-input,
body.dark .option-input,
body.dark .modal-input,
body.dark .modal-textarea {
    background: #202023;
    color: var(--text);
    border-color: var(--border);
}

body.dark .month-button {
    background: #202023;
    color: var(--text);
}

body.dark .search-box {
    background: #1b1b1e;
}


/* =========================
   APP
========================= */

.app {
    width: min(1280px, calc(100% - 40px));
    margin: auto;
}


/* =========================
   HEADER
========================= */

header {
    height: 88px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    border-bottom: 1px solid var(--border);
}

.logo {
    display: flex;
    align-items: center;
    gap: 12px;
}

.logo-mark {
    width: 41px;
    height: 41px;

    border-radius: 13px;

    background: var(--text);
    color: var(--bg);

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 18px;
    font-weight: 900;

    transition: .25s;
}

.logo-text {
    font-size: 21px;
    font-weight: 850;
    letter-spacing: -.8px;
}

.logo-text span {
    color: var(--accent);
}

.header-right {
    display: flex;
    align-items: center;
    gap: 8px;
}

.header-date {
    color: var(--muted);
    font-size: 12px;
    font-weight: 650;

    margin-right: 8px;
}

.header-button {
    width: 38px;
    height: 38px;

    border: 1px solid var(--border);

    border-radius: 12px;

    background: var(--surface);

    color: var(--text);

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 16px;

    transition: .2s;
}

.header-button:hover {
    border-color: var(--accent);
    color: var(--accent);
    transform: translateY(-1px);
}


/* =========================
   MAIN
========================= */

main {
    padding: 30px 0 50px;
}


/* =========================
   TOP BAR
========================= */

.top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;

    margin-bottom: 20px;
}

.page-title {
    font-size: 14px;
    font-weight: 800;
    color: var(--muted);
    letter-spacing: .2px;
}

.search-box {
    width: 220px;

    display: flex;
    align-items: center;
    gap: 8px;

    background: rgba(255,255,255,.7);

    border: 1px solid var(--border);

    border-radius: 12px;

    padding: 9px 11px;

    transition: .2s;
}

.search-box:focus-within {
    border-color: var(--accent);

    box-shadow:
        0 0 0 3px rgba(99,91,223,.08);
}

.search-icon {
    color: var(--muted);
    font-size: 13px;
}

.search-box input {
    width: 100%;

    border: none;
    outline: none;

    background: transparent;

    color: var(--text);

    font-size: 11px;
}


/* =========================
   LAYOUT
========================= */

.layout {
    display: grid;

    grid-template-columns:
        minmax(0, 1.55fr)
        minmax(350px, .75fr);

    gap: 22px;
}

.card {
    background: rgba(255,255,255,.88);

    border:
        1px solid rgba(229,226,218,.9);

    border-radius: var(--radius);

    box-shadow: var(--shadow);

    backdrop-filter: blur(16px);
}


/* =========================
   CALENDAR
========================= */

.calendar-card {
    padding: 26px;
}

.calendar-header {
    display: flex;
    align-items: center;
    justify-content: space-between;

    margin-bottom: 25px;
}

.month-area {
    display: flex;
    align-items: center;
    gap: 8px;
}

.month-title {
    min-width: 180px;

    font-size: 24px;
    font-weight: 850;

    letter-spacing: -.9px;
}

.month-button {
    width: 35px;
    height: 35px;

    border-radius: 11px;

    border: 1px solid var(--border);

    background: var(--surface);

    color: var(--text);

    font-size: 20px;

    transition: .2s;
}

.month-button:hover {
    background: var(--accent-light);
    color: var(--accent);
    border-color: var(--accent);
}

.today-button {
    border: none;

    background: var(--text);
    color: var(--bg);

    border-radius: 11px;

    padding: 10px 14px;

    font-size: 11px;
    font-weight: 800;

    transition: .2s;
}

.today-button:hover {
    transform: translateY(-1px);
}


/* =========================
   WEEKDAYS
========================= */

.weekdays,
.calendar-grid {
    display: grid;

    grid-template-columns:
        repeat(7, 1fr);

    gap: 7px;
}

.weekdays {
    margin-bottom: 8px;
}

.weekday {
    text-align: center;

    color: var(--muted);

    font-size: 9px;
    font-weight: 850;

    letter-spacing: .7px;
}


/* =========================
   DAYS
========================= */

.day {
    position: relative;

    min-height: 94px;

    padding: 9px;

    background: var(--surface-2);

    border: 1px solid transparent;

    border-radius: 14px;

    cursor: pointer;

    transition:
        transform .18s,
        background .18s,
        border .18s;
}

.day:hover {
    transform: translateY(-2px);

    background: var(--surface);

    border-color: var(--border);
}

.day.empty {
    background: transparent;
    cursor: default;
}

.day-number {
    display: inline-flex;

    width: 27px;
    height: 27px;

    align-items: center;
    justify-content: center;

    border-radius: 9px;

    font-size: 11px;
    font-weight: 850;
}

.day.today .day-number {
    background: var(--text);
    color: var(--bg);
}

.day.selected {
    border-color: var(--accent);

    background: var(--accent-light);
}

.day.selected .day-number {
    background: var(--accent);
    color: white;
}


/* =========================
   CALENDAR TASKS
========================= */

.day-tasks {
    display: flex;

    flex-direction: column;

    gap: 4px;

    margin-top: 7px;
}

.day-task {
    display: flex;
    align-items: center;

    gap: 5px;

    min-width: 0;

    font-size: 8px;
    font-weight: 650;

    color: var(--muted);
}

.task-dot {
    width: 5px;
    height: 5px;

    border-radius: 50%;

    flex-shrink: 0;
}

.day-task.completed {
    opacity: .4;

    text-decoration: line-through;
}

.more-tasks {
    color: var(--muted);

    font-size: 8px;
    font-weight: 800;

    margin-top: 1px;
}


/* =========================
   TASK PANEL
========================= */

.tasks-card {
    overflow: hidden;
}

.tasks-header {
    padding: 25px 24px 21px;

    background:
        linear-gradient(
            135deg,
            #171718,
            #29272d
        );

    color: white;
}

.tasks-header-top {
    display: flex;

    align-items: flex-start;
    justify-content: space-between;
}

.tasks-day {
    font-size: 20px;
    font-weight: 850;

    letter-spacing: -.5px;
}

.tasks-count {
    padding: 6px 9px;

    border-radius: 9px;

    background: rgba(255,255,255,.1);

    color: rgba(255,255,255,.72);

    font-size: 9px;
    font-weight: 750;
}

.tasks-subtitle {
    margin-top: 5px;

    color: rgba(255,255,255,.5);

    font-size: 10px;
}


/* =========================
   ADD AREA
========================= */

.add-area {
    padding: 17px 20px 5px;
}

.task-input {
    width: 100%;

    padding: 12px 13px;

    border:
        1px solid var(--border);

    border-radius: 12px;

    background: var(--surface);

    color: var(--text);

    outline: none;

    font-size: 12px;

    transition: .2s;
}

.task-input:focus {
    border-color: var(--accent);

    box-shadow:
        0 0 0 3px rgba(99,91,223,.08);
}

.task-options {
    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 7px;

    margin-top: 7px;
}

.option-input {
    width: 100%;

    border:
        1px solid var(--border);

    background: var(--surface);

    border-radius: 10px;

    padding: 10px;

    color: var(--text);

    outline: none;

    font-size: 10px;
}

.add-button {
    width: 100%;
    height: 40px;

    margin-top: 7px;

    border: none;

    border-radius: 10px;

    background: var(--accent);

    color: white;

    font-size: 11px;
    font-weight: 800;

    transition: .2s;
}

.add-button:hover {
    background: var(--accent-dark);

    transform: translateY(-1px);
}


/* =========================
   TASK LIST
========================= */

.tasks-list {
    padding: 14px 20px 20px;

    display: flex;

    flex-direction: column;

    gap: 7px;

    min-height: 350px;
}

.task {
    display: flex;
    align-items: center;

    gap: 10px;

    padding: 11px;

    border:
        1px solid var(--border);

    border-radius: 12px;

    background: var(--surface);

    transition: .2s;

    cursor: pointer;
}

.task:hover {
    border-color: var(--accent);

    box-shadow:
        0 7px 20px rgba(25,24,20,.05);

    transform: translateY(-1px);
}

.check {
    width: 22px;
    height: 22px;

    flex-shrink: 0;

    border-radius: 7px;

    border:
        1.5px solid #bbb9b1;

    background: transparent;

    color: white;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 12px;
    font-weight: 900;

    transition: .2s;
}

.task.completed .check {
    background: var(--accent);
    border-color: var(--accent);
}

.task-info {
    flex: 1;
    min-width: 0;
}

.task-name {
    font-size: 11px;
    font-weight: 800;

    overflow-wrap: anywhere;
}

.task.completed .task-name {
    color: var(--muted);

    text-decoration: line-through;
}

.task-meta {
    display: flex;
    align-items: center;

    flex-wrap: wrap;

    gap: 5px;

    margin-top: 4px;

    color: var(--muted);

    font-size: 8px;
}

.category {
    padding: 3px 7px;

    border-radius: 20px;

    font-weight: 800;
}

.category-sport {
    background: #e7f0ff;
    color: var(--sport);
}

.category-etudes {
    background: #f0e9ff;
    color: var(--study);
}

.category-sante {
    background: #ffe8ec;
    color: var(--health);
}

.category-personnel {
    background: #fff1d8;
    color: var(--personal);
}

.category-travail {
    background: #e5f5ed;
    color: var(--work);
}

.dark .category-sport {
    background: #202e49;
}

.dark .category-etudes {
    background: #302644;
}

.dark .category-sante {
    background: #40252b;
}

.dark .category-personnel {
    background: #40321e;
}

.dark .category-travail {
    background: #20372d;
}

.delete {
    border: none;

    background: transparent;

    color: var(--muted);

    font-size: 16px;

    padding: 4px;

    opacity: 0;

    transition: .2s;
}

.task:hover .delete {
    opacity: 1;
}

.delete:hover {
    color: var(--danger);
}


/* =========================
   STATS
========================= */

.stats-section {
    margin-top: 22px;
}

.stats-grid {
    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 12px;
}

.stat {
    background: var(--surface);

    border:
        1px solid var(--border);

    border-radius: 17px;

    padding: 16px;

    box-shadow:
        0 8px 25px rgba(25,24,20,.04);
}

.stat-label {
    color: var(--muted);

    font-size: 9px;
    font-weight: 750;
}

.stat-value {
    margin-top: 7px;

    font-size: 21px;
    font-weight: 850;

    letter-spacing: -.7px;
}

.stat-small {
    margin-top: 2px;

    color: var(--muted);

    font-size: 8px;
}


/* =========================
   SEARCH RESULTS
========================= */

.search-results {
    display: none;

    margin-top: 14px;

    padding: 15px;

    background: var(--surface);

    border:
        1px solid var(--border);

    border-radius: 17px;

    box-shadow: var(--shadow);
}

.search-results.active {
    display: block;
}

.search-result-title {
    color: var(--muted);

    font-size: 9px;
    font-weight: 800;

    margin-bottom: 8px;
}

.search-result {
    padding: 9px;

    border-radius: 10px;

    cursor: pointer;

    transition: .15s;
}

.search-result:hover {
    background: var(--surface-2);
}

.search-result-name {
    font-size: 11px;
    font-weight: 800;
}

.search-result-date {
    margin-top: 3px;

    color: var(--muted);

    font-size: 8px;
}


/* =========================
   MODAL
========================= */

.modal-overlay {
    position: fixed;

    inset: 0;

    z-index: 100;

    display: none;

    align-items: center;
    justify-content: center;

    padding: 20px;

    background: rgba(15,15,17,.48);

    backdrop-filter: blur(8px);
}

.modal-overlay.active {
    display: flex;
}

.modal {
    width: min(470px, 100%);

    background: var(--surface);

    border:
        1px solid var(--border);

    border-radius: 24px;

    box-shadow:
        0 30px 90px rgba(0,0,0,.2);

    overflow: hidden;

    animation:
        modalIn .2s ease;
}

@keyframes modalIn {
    from {
        opacity: 0;
        transform: translateY(10px) scale(.98);
    }

    to {
        opacity: 1;
        transform: none;
    }
}

.modal-header {
    padding: 20px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    border-bottom:
        1px solid var(--border);
}

.modal-title {
    font-size: 16px;
    font-weight: 850;
}

.modal-close {
    width: 32px;
    height: 32px;

    border: none;

    border-radius: 10px;

    background: var(--surface-2);

    color: var(--muted);

    font-size: 18px;
}

.modal-body {
    padding: 20px;
}

.modal-label {
    display: block;

    margin-bottom: 6px;

    color: var(--muted);

    font-size: 9px;
    font-weight: 800;
}

.modal-input,
.modal-textarea {
    width: 100%;

    border:
        1px solid var(--border);

    border-radius: 11px;

    padding: 11px;

    background: var(--surface);

    color: var(--text);

    outline: none;

    font-size: 11px;

    margin-bottom: 14px;
}

.modal-input:focus,
.modal-textarea:focus {
    border-color: var(--accent);
}

.modal-textarea {
    min-height: 85px;

    resize: vertical;
}

.modal-grid {
    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 9px;
}

.modal-footer {
    display: flex;

    justify-content: space-between;

    gap: 8px;

    padding: 15px 20px;

    border-top:
        1px solid var(--border);
}

.modal-button {
    border: none;

    border-radius: 10px;

    padding: 10px 14px;

    font-size: 10px;
    font-weight: 800;
}

.modal-cancel {
    background: var(--surface-2);

    color: var(--text);
}

.modal-save {
    background: var(--accent);

    color: white;
}

.modal-delete {
    margin-right: auto;

    background: transparent;

    color: var(--danger);
}


/* =========================
   FOOTER
========================= */

footer {
    padding: 20px 2px 30px;

    display: flex;
    justify-content: space-between;

    color: var(--muted);

    font-size: 9px;
}


/* =========================
   TABLET
========================= */

@media (max-width: 950px) {

    .layout {
        grid-template-columns: 1fr;
    }

    .stats-grid {
        grid-template-columns:
            repeat(2, 1fr);
    }

    .tasks-list {
        min-height: 250px;
    }
}


/* =========================
   MOBILE
========================= */

@media (max-width: 650px) {

    .app {
        width: calc(100% - 16px);
    }

    header {
        height: 68px;
    }

    .header-date {
        display: none;
    }

    main {
        padding: 14px 0 30px;
    }

    .top-bar {
        margin-bottom: 13px;
    }

    .page-title {
        font-size: 12px;
    }

    .search-box {
        width: 155px;
    }

    .layout {
        gap: 13px;
    }

    .calendar-card {
        padding: 12px;

        border-radius: 19px;
    }

    .calendar-header {
        margin-bottom: 17px;
    }

    .month-title {
        min-width: 0;

        font-size: 18px;
    }

    .month-button {
        width: 31px;
        height: 31px;
    }

    .today-button {
        padding: 8px 10px;

        font-size: 9px;
    }

    .weekdays,
    .calendar-grid {
        gap: 4px;
    }

    .day {
        min-height: 62px;

        padding: 5px;

        border-radius: 10px;
    }

    .day-number {
        width: 23px;
        height: 23px;

        font-size: 9px;
    }

    .day-tasks {
        margin-top: 4px;

        gap: 2px;
    }

    .day-task {
        font-size: 7px;
    }

    .day-task .task-text {
        display: none;
    }

    .task-dot {
        width: 5px;
        height: 5px;
    }

    .more-tasks {
        font-size: 7px;
    }

    .tasks-header {
        padding: 19px;
    }

    .tasks-day {
        font-size: 18px;
    }

    .add-area {
        padding: 13px 15px 5px;
    }

    .tasks-list {
        padding: 10px 15px 15px;
    }

    .delete {
        opacity: 1;
    }

    .stats-section {
        margin-top: 13px;
    }

    .stats-grid {
        gap: 7px;
    }

    .stat {
        padding: 12px;

        border-radius: 13px;
    }

    .stat-value {
        font-size: 17px;
    }

    footer {
        display: none;
    }
}


/* =========================
   SMALL PHONES
========================= */

@media (max-width: 380px) {

    .app {
        width: calc(100% - 10px);
    }

    .search-box {
        width: 135px;
    }

    .day {
        min-height: 56px;
    }

    .today-button {
        display: none;
    }
}
</style>
</head>


<body>

<div class="app">


<!-- HEADER -->

<header>

    <div class="logo">

        <div class="logo-mark">
            H
        </div>

        <div class="logo-text">
            Habits<span>.</span>
        </div>

    </div>


    <div class="header-right">

        <div
            class="header-date"
            id="headerDate"
        ></div>

        <button
            class="header-button"
            id="themeButton"
            title="Changer le thème"
        >
            ◐
        </button>

    </div>

</header>


<main>


<!-- TOP BAR -->

<div class="top-bar">

    <div class="page-title">
        Mon planning
    </div>


    <div class="search-box">

        <span class="search-icon">
            ⌕
        </span>

        <input
            id="searchInput"
            type="search"
            placeholder="Rechercher..."
            autocomplete="off"
        >

    </div>

</div>


<!-- SEARCH -->

<div
    class="search-results"
    id="searchResults"
></div>


<!-- MAIN -->

<div class="layout">


<!-- CALENDAR -->

<section class="card calendar-card">

    <div class="calendar-header">

        <div class="month-area">

            <button
                class="month-button"
                id="previousMonth"
            >
                ‹
            </button>

            <div
                class="month-title"
                id="monthTitle"

<script>

/* =========================
   DATA
========================= */

let tasks =
    JSON.parse(
        localStorage.getItem("habitsV3Tasks")
    ) || {};

let currentDate =
    new Date();

let selectedDate =
    new Date();

let editingTaskId =
    null;

let editingTaskKey =
    null;


/* =========================
   CATEGORIES
========================= */

const categories = {

    sport: {
        name: "Sport",
        icon: "🏃",
        color: "#4d8df7"
    },

    etudes: {
        name: "Études",
        icon: "📚",
        color: "#9669df"
    },

    sante: {
        name: "Santé",
        icon: "❤️",
        color: "#e66b7b"
    },

    personnel: {
        name: "Personnel",
        icon: "●",
        color: "#d69a36"
    },

    travail: {
        name: "Travail",
        icon: "💼",
        color: "#4ca477"
    }

};


/* =========================
   ELEMENTS
========================= */

const calendar =
    document.getElementById("calendar");

const monthTitle =
    document.getElementById("monthTitle");

const selectedDateElement =
    document.getElementById("selectedDate");

const tasksList =
    document.getElementById("tasksList");

const tasksCount =
    document.getElementById("tasksCount");

const taskForm =
    document.getElementById("taskForm");

const taskInput =
    document.getElementById("taskInput");

const taskTime =
    document.getElementById("taskTime");

const taskCategory =
    document.getElementById("taskCategory");

const headerDate =
    document.getElementById("headerDate");

const searchInput =
    document.getElementById("searchInput");

const searchResults =
    document.getElementById("searchResults");

const modalOverlay =
    document.getElementById("modalOverlay");

const editName =
    document.getElementById("editName");

const editTime =
    document.getElementById("editTime");

const editCategory =
    document.getElementById("editCategory");

const editRepeat =
    document.getElementById("editRepeat");

const editNote =
    document.getElementById("editNote");


/* =========================
   UTILITIES
========================= */

function getKey(date) {

    return [

        date.getFullYear(),

        String(
            date.getMonth() + 1
        ).padStart(2, "0"),

        String(
            date.getDate()
        ).padStart(2, "0")

    ].join("-");

}


function save() {

    localStorage.setItem(
        "habitsV3Tasks",
        JSON.stringify(tasks)
    );

}


function capitalize(text) {

    return text.charAt(0).toUpperCase()
        + text.slice(1);

}


function formatDate(date) {

    return date.toLocaleDateString(
        "fr-FR",
        {
            weekday: "long",
            day: "numeric",
            month: "long"
        }
    );

}


function formatShortDate(key) {

    const date =
        new Date(key + "T12:00:00");

    return date.toLocaleDateString(
        "fr-FR",
        {
            day: "numeric",
            month: "short"
        }
    );

}


/* =========================
   HEADER
========================= */

function renderHeaderDate() {

    headerDate.textContent =
        new Date().toLocaleDateString(
            "fr-FR",
            {
                weekday: "long",
                day: "numeric",
                month: "long",
                year: "numeric"
            }
        );

}


/* =========================
   CALENDAR
========================= */

function renderCalendar() {

    calendar.innerHTML = "";

    const year =
        currentDate.getFullYear();

    const month =
        currentDate.getMonth();


    const monthNames = [

        "Janvier",
        "Février",
        "Mars",
        "Avril",
        "Mai",
        "Juin",
        "Juillet",
        "Août",
        "Septembre",
        "Octobre",
        "Novembre",
        "Décembre"

    ];


    monthTitle.textContent =
        `${monthNames[month]} ${year}`;


    let firstDay =
        new Date(
            year,
            month,
            1
        ).getDay();


    firstDay =
        firstDay === 0
            ? 6
            : firstDay - 1;


    const daysInMonth =
        new Date(
            year,
            month + 1,
            0
        ).getDate();


    for (
        let i = 0;
        i < firstDay;
        i++
    ) {

        const empty =
            document.createElement("div");

        empty.className =
            "day empty";

        calendar.appendChild(empty);

    }


    const todayKey =
        getKey(new Date());


    for (
        let day = 1;
        day <= daysInMonth;
        day++
    ) {

        const date =
            new Date(
                year,
                month,
                day
            );


        const key =
            getKey(date);


        const cell =
            document.createElement("div");

        cell.className =
            "day";


        if (key === todayKey) {

            cell.classList.add(
                "today"
            );

        }


        if (
            key ===
            getKey(selectedDate)
        ) {

            cell.classList.add(
                "selected"
            );

        }


        const number =
            document.createElement("div");

        number.className =
            "day-number";

        number.textContent =
            day;

        cell.appendChild(number);


        const dayTasks =
            tasks[key] || [];


        if (dayTasks.length) {

            const taskContainer =
                document.createElement("div");

            taskContainer.className =
                "day-tasks";


            dayTasks
                .slice(0, 3)
                .forEach(task => {

                    const row =
                        document.createElement("div");

                    row.className =
                        "day-task";


                    if (task.completed) {

                        row.classList.add(
                            "completed"
                        );

                    }


                    const dot =
                        document.createElement("div");

                    dot.className =
                        "task-dot";


                    const category =
                        categories[
                            task.category
                        ];


                    if (category) {

                        dot.style.background =
                            category.color;

                    }


                    const text =
                        document.createElement("span");

                    text.className =
                        "task-text";

                    text.textContent =
                        task.name;


                    row.appendChild(dot);

                    row.appendChild(text);

                    taskContainer.appendChild(row);

                });


            if (dayTasks.length > 3) {

                const more =
                    document.createElement("div");

                more.className =
                    "more-tasks";

                more.textContent =
                    `+${dayTasks.length - 3}`;

                taskContainer.appendChild(
                    more
                );

            }


            cell.appendChild(
                taskContainer
            );

        }


        cell.addEventListener(
            "click",
            () => {

                selectedDate =
                    new Date(date);

                renderCalendar();

                renderTasks();

            }
        );


        calendar.appendChild(cell);

    }

}


/* =========================
   TASKS
========================= */

function renderTasks() {

    const key =
        getKey(selectedDate);


    const dayTasks =
        tasks[key] || [];


    selectedDateElement.textContent =
        capitalize(
            formatDate(selectedDate)
        );


    tasksCount.textContent =
        `${dayTasks.length} ${
            dayTasks.length === 1
                ? "tâche"
                : "tâches"
        }`;


    tasksList.innerHTML = "";


    if (!dayTasks.length) {

        return;

    }


    const sortedTasks =
        [...dayTasks].sort(
            (a, b) => {

                if (!a.time) return 1;

                if (!b.time) return -1;

                return a.time.localeCompare(
                    b.time
                );

            }
        );


    sortedTasks.forEach(task => {

        const item =
            document.createElement("div");

        item.className =
            "task";


        if (task.completed) {

            item.classList.add(
                "completed"
            );

        }


        const check =
            document.createElement("button");

        check.className =
            "check";

        check.textContent =
            task.completed
                ? "✓"
                : "";


        check.addEventListener(
            "click",
            event => {

                event.stopPropagation();

                task.completed =
                    !task.completed;

                save();

                renderTasks();

                renderCalendar();

                renderStats();

            }
        );


        const info =
            document.createElement("div");

        info.className =
            "task-info";


        const name =
            document.createElement("div");

        name.className =
            "task-name";

        name.textContent =
            task.name;


        const meta =
            document.createElement("div");

        meta.className =
            "task-meta";


        if (task.time) {

            const time =
                document.createElement("span");

            time.textContent =
                "◷ " + task.time;

            meta.appendChild(time);

        }


        const category =
            categories[
                task.category
            ] ||
            categories.personnel;


        const badge =
            document.createElement("span");

        badge.className =
            `category category-${
                task.category || "personnel"
            }`;

        badge.textContent =
            `${category.icon} ${category.name}`;


        meta.appendChild(badge);


        if (task.repeat &&
            task.repeat !== "none") {

            const repeat =
                document.createElement("span");

            repeat.textContent =
                "↻";

            meta.appendChild(repeat);

        }


        info.appendChild(name);

        info.appendChild(meta);


        const deleteButton =
            document.createElement("button");

        deleteButton.className =
            "delete";

        deleteButton.textContent =
            "×";


        deleteButton.addEventListener(
            "click",
            event => {

                event.stopPropagation();

                deleteTask(
                    key,
                    task.id
                );

            }
        );


        item.appendChild(check);

        item.appendChild(info);

        item.appendChild(deleteButton);


        item.addEventListener(
            "click",
            () => {

                openEditModal(
                    key,
                    task.id
                );

            }
        );


        tasksList.appendChild(item);

    });

}


/* =========================
   ADD TASK
========================= */

taskForm.addEventListener(
    "submit",
    event => {

        event.preventDefault();


        const name =
            taskInput.value.trim();


        if (!name) return;


        const key =
            getKey(selectedDate);


        if (!tasks[key]) {

            tasks[key] = [];

        }


        tasks[key].push({

            id:
                Date.now(),

            name:
                name,

            time:
                taskTime.value,

            category:
                taskCategory.value,

            note:
                "",

            repeat:
                "none",

            completed:
                false

        });


        save();


        taskInput.value = "";

        taskTime.value = "";


        renderTasks();

        renderCalendar();

        renderStats();


        taskInput.focus();

    }
);


/* =========================
   DELETE
========================= */

function deleteTask(key, id) {

    if (!tasks[key]) return;


    tasks[key] =
        tasks[key].filter(
            task =>
                task.id !== id
        );


    if (!tasks[key].length) {

        delete tasks[key];

    }


    save();

    renderTasks();

    renderCalendar();

    renderStats();

}


/* =========================
   EDIT MODAL
========================= */

function openEditModal(key, id) {

    const task =
        (tasks[key] || [])
            .find(
                item =>
                    item.id === id
            );


    if (!task) return;


    editingTaskId =
        id;

    editingTaskKey =
        key;


    editName.value =
        task.name || "";

    editTime.value =
        task.time || "";

    editCategory.value =
        task.category || "personnel";

    editRepeat.value =
        task.repeat || "none";

    editNote.value =
        task.note || "";


    modalOverlay.classList.add(
        "active"
    );

}


function closeModal() {

    modalOverlay.classList.remove(
        "active"
    );

    editingTaskId =
        null;

    editingTaskKey =
        null;

}


/* SAVE EDIT */

document
    .getElementById("modalSave")
    .addEventListener(
        "click",
        () => {

            if (
                editingTaskId === null ||
                !editingTaskKey
            ) {
                return;
            }


            const task =
                (tasks[editingTaskKey] || [])
                    .find(
                        item =>
                            item.id ===
                            editingTaskId
                    );


            if (!task) return;


            const name =
                editName.value.trim();


            if (!name) return;


            task.name =
                name;

            task.time =
                editTime.value;

            task.category =
                editCategory.value;

            task.repeat =
                editRepeat.value;

            task.note =
                editNote.value.trim();


            save();

            closeModal();

            renderTasks();

            renderCalendar();

            renderStats();

        }
    );


/* DELETE FROM MODAL */

document
    .getElementById("modalDelete")
    .addEventListener(
        "click",
        () => {

            if (
                editingTaskId === null ||
                !editingTaskKey
            ) {
                return;
            }


            deleteTask(
                editingTaskKey,
                editingTaskId
            );


            closeModal();

        }
    );


document
    .getElementById("modalClose")
    .addEventListener(
        "click",
        closeModal
    );


document
    .getElementById("modalCancel")
    .addEventListener(
        "click",
        closeModal
    );


modalOverlay.addEventListener(
    "click",
    event => {

        if (
            event.target ===
            modalOverlay
        ) {

            closeModal();

        }

    }
);


/* =========================
   MONTH NAVIGATION
========================= */

document
    .getElementById("previousMonth")
    .addEventListener(
        "click",
        () => {

            currentDate.setMonth(
                currentDate.getMonth() - 1
            );

            renderCalendar();

            renderStats();

        }
    );


document
    .getElementById("nextMonth")
    .addEventListener(
        "click",
        () => {

            currentDate.setMonth(
                currentDate.getMonth() + 1
            );

            renderCalendar();

            renderStats();

        }
    );


/* =========================
   TODAY
========================= */

document
    .getElementById("todayButton")
    .addEventListener(
        "click",
        () => {

            const today =
                new Date();


            currentDate =
                new Date(today);

            selectedDate =
                new Date(today);


            renderCalendar();

            renderTasks();

            renderStats();

        }
    );


/* =========================
   THEME
========================= */

const savedTheme =
    localStorage.getItem(
        "habitsTheme"
    );


if (savedTheme === "dark") {

    document.body.classList.add(
        "dark"
    );

}


document
    .getElementById("themeButton")
    .addEventListener(
        "click",
        () => {

            document.body.classList.toggle(
                "dark"
            );


            const isDark =
                document.body.classList.contains(
                    "dark"
                );


            localStorage.setItem(
                "habitsTheme",
                isDark
                    ? "dark"
                    : "light"
            );

        }
    );


/* =========================
   SEARCH
========================= */

searchInput.addEventListener(
    "input",
    () => {

        const query =
            searchInput.value
                .trim()
                .toLowerCase();


        if (!query) {

            searchResults.classList.remove(
                "active"
            );

            searchResults.innerHTML =
                "";

            return;

        }


        const results = [];


        Object.keys(tasks)
            .forEach(key => {

                tasks[key]
                    .forEach(task => {

                        const matches =
                            task.name
                                .toLowerCase()
                                .includes(query) ||

                            (
                                task.note || ""
                            )
                                .toLowerCase()
                                .includes(query);


                        if (matches) {

                            results.push({
                                key,
                                task
                            });

                        }

                    });

            });


        searchResults.innerHTML =
            "";


        const title =
            document.createElement("div");

        title.className =
            "search-result-title";

        title.textContent =
            `${results.length} résultat${
                results.length > 1
                    ? "s"
                    : ""
            }`;

        searchResults.appendChild(
            title
        );


        results
            .slice(0, 10)
            .forEach(result => {

                const row =
                    document.createElement("div");

                row.className =
                    "search-result";


                const name =
                    document.createElement("div");

                name.className =
                    "search-result-name";

                name.textContent =
                    result.task.name;


                const date =
                    document.createElement("div");

                date.className =
                    "search-result-date";

                date.textContent =
                    formatShortDate(
                        result.key
                    );


                row.appendChild(name);

                row.appendChild(date);


                row.addEventListener(
                    "click",
                    () => {

                        const dateObj =
                            new Date(
                                result.key +
                                "T12:00:00"
                            );


                        selectedDate =
                            dateObj;

                        currentDate =
                            new Date(
                                dateObj
                            );


                        searchInput.value =
                            "";

                        searchResults.classList.remove(
                            "active"
                        );

                        renderCalendar();

                        renderTasks();

                        renderStats();

                    }
                );


                searchResults.appendChild(
                    row
                );

            });


        if (!results.length) {

            const none =
                document.createElement("div");

            none.style.color =
                "var(--muted)";

            none.style.fontSize =
                "10px";

            none.textContent =
                "Aucune tâche trouvée.";

            searchResults.appendChild(
                none
            );

        }


        searchResults.classList.add(
            "active"
        );

    });


/* =========================
   STATISTICS
========================= */

function renderStats() {

    const year =
        currentDate.getFullYear();

    const month =
        currentDate.getMonth();


    const daysInMonth =
        new Date(
            year,
            month + 1,
            0
        ).getDate();


    let total =
        0;

    let completed =
        0;

    let activeDays =
        0;


    for (
        let day = 1;
        day <= daysInMonth;
        day++
    ) {

        const date =
            new Date(
                year,
                month,
                day
            );


        const key =
            getKey(date);


        const dayTasks =
            tasks[key] || [];


        if (dayTasks.length) {

            activeDays++;

        }


        total +=
            dayTasks.length;


        completed +=
            dayTasks.filter(
                task =>
                    task.completed
            ).length;

    }


    const percentage =
        total
            ? Math.round(
                completed /
                total *
                100
            )
            : 0;


    document.getElementById(
        "statTotal"
    ).textContent =
        total;


    document.getElementById(
        "statCompleted"
    ).textContent =
        percentage + "%";


    document.getElementById(
        "statDays"
    ).textContent =
        activeDays;


    document.getElementById(
        "statStreak"
    ).textContent =
        calculateStreak() + " 🔥";

}


/* =========================
   STREAK
========================= */

function calculateStreak() {

    let streak =
        0;


    const date =
        new Date();


    while (true) {

        const key =
            getKey(date);


        const dayTasks =
            tasks[key] || [];


        if (
            !dayTasks.length ||
            !dayTasks.every(
                task =>
                    task.completed
            )
        ) {

            break;

        }


        streak++;


        date.setDate(
            date.getDate() - 1
        );

    }


    return streak;

}


/* =========================
   KEYBOARD ESC
========================= */

document.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Escape"
        ) {

            closeModal();

        }

    }
);


/* =========================
   START
========================= */

renderHeaderDate();

renderCalendar();

renderTasks();

renderStats();

</script>
