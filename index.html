<style>

/* =========================================================
   HABITS. — PREMIUM UI
   ========================================================= */

:root{
    --bg:#f4f7f5;
    --surface:rgba(255,255,255,.82);
    --surface-solid:#ffffff;
    --surface-2:#edf3ef;

    --text:#18231d;
    --muted:#758078;

    --primary:#5d9674;
    --primary-strong:#44785a;
    --primary-soft:rgba(93,150,116,.13);

    --border:rgba(24,35,29,.08);
    --shadow:0 18px 50px rgba(26,45,34,.08);

    --nav-bg:rgba(255,255,255,.72);

    --radius:24px;
    --radius-small:17px;

    --transition:.25s cubic-bezier(.22,.8,.22,1);

    --glow:rgba(93,150,116,.18);
}

/* =========================================================
   THEMES
   ========================================================= */

/* LIGHT */

body.theme-sage{
    --bg:#f4f8f5;
    --surface:rgba(255,255,255,.82);
    --surface-solid:#fff;
    --surface-2:#edf5ef;
    --text:#203128;
    --muted:#718078;
    --primary:#5f9675;
    --primary-strong:#477b5d;
    --primary-soft:rgba(95,150,117,.13);
    --glow:rgba(95,150,117,.18);
}

body.theme-sakura{
    --bg:#fff4f7;
    --surface:rgba(255,250,252,.78);
    --surface-solid:#fffafd;
    --surface-2:#fbe7ed;
    --text:#39242c;
    --muted:#94747e;
    --primary:#e786a5;
    --primary-strong:#cf6488;
    --primary-soft:rgba(231,134,165,.15);
    --glow:rgba(231,134,165,.25);
}

body.theme-ocean{
    --bg:#eef8fb;
    --surface:rgba(255,255,255,.78);
    --surface-solid:#fff;
    --surface-2:#e0f2f6;
    --text:#18333a;
    --muted:#718c94;
    --primary:#4d9eb0;
    --primary-strong:#347d91;
    --primary-soft:rgba(77,158,176,.14);
    --glow:rgba(77,158,176,.22);
}

body.theme-lavender{
    --bg:#f6f2fc;
    --surface:rgba(255,255,255,.8);
    --surface-solid:#fff;
    --surface-2:#ece5f8;
    --text:#2d263a;
    --muted:#82758f;
    --primary:#9279c4;
    --primary-strong:#755ba8;
    --primary-soft:rgba(146,121,196,.14);
    --glow:rgba(146,121,196,.22);
}

body.theme-sunset{
    --bg:#fff5ed;
    --surface:rgba(255,251,247,.8);
    --surface-solid:#fff;
    --surface-2:#fae7d9;
    --text:#392820;
    --muted:#957c6e;
    --primary:#df8964;
    --primary-strong:#bd6846;
    --primary-soft:rgba(223,137,100,.15);
    --glow:rgba(223,137,100,.23);
}

body.theme-sage-dark{
    --bg:#101813;
    --surface:rgba(25,34,28,.78);
    --surface-solid:#19221c;
    --surface-2:#202d25;
    --text:#edf6ef;
    --muted:#9aaa9f;
    --primary:#83c79c;
    --primary-strong:#a2d9b5;
    --primary-soft:rgba(131,199,156,.13);
    --glow:rgba(131,199,156,.2);
}

/* SPECIAL DARK */

body.theme-midnight{
    --bg:#080c16;
    --surface:rgba(17,23,37,.78);
    --surface-solid:#111725;
    --surface-2:#192135;
    --text:#edf2ff;
    --muted:#8e9ab3;
    --primary:#87a9ff;
    --primary-strong:#a8c1ff;
    --primary-soft:rgba(135,169,255,.13);
    --glow:rgba(100,140,255,.25);
}

body.theme-aurora{
    --bg:#071412;
    --surface:rgba(14,29,27,.75);
    --surface-solid:#10201e;
    --surface-2:#19322d;
    --text:#effff8;
    --muted:#91aaa1;
    --primary:#70e0b0;
    --primary-strong:#98f0c8;
    --primary-soft:rgba(112,224,176,.13);
    --glow:rgba(75,255,177,.25);
}

body.theme-cyber{
    --bg:#0c0714;
    --surface:rgba(23,14,36,.76);
    --surface-solid:#171024;
    --surface-2:#241638;
    --text:#f8f0ff;
    --muted:#a894b7;
    --primary:#c084ff;
    --primary-strong:#d6a8ff;
    --primary-soft:rgba(192,132,255,.14);
    --glow:rgba(192,80,255,.3);
}

body.theme-ocean-dark{
    --bg:#061218;
    --surface:rgba(12,28,37,.78);
    --surface-solid:#0d1d27;
    --surface-2:#15313e;
    --text:#ecfbff;
    --muted:#88a6b0;
    --primary:#4fd0e8;
    --primary-strong:#83e5f4;
    --primary-soft:rgba(79,208,232,.13);
    --glow:rgba(79,208,232,.25);
}

body.theme-coffee{
    --bg:#17110e;
    --surface:rgba(34,25,20,.8);
    --surface-solid:#241a15;
    --surface-2:#30231c;
    --text:#fff5ec;
    --muted:#ae9787;
    --primary:#d79a6d;
    --primary-strong:#e8b18b;
    --primary-soft:rgba(215,154,109,.14);
    --glow:rgba(215,154,109,.2);
}

/* =========================================================
   RESET
   ========================================================= */

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    min-height:100vh;

    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        Segoe UI,
        sans-serif;

    color:var(--text);
    background:var(--bg);

    transition:
        background .4s ease,
        color .3s ease;
}

button,
input,
select,
textarea{
    font:inherit;
}

button{
    border:0;
    cursor:pointer;
    color:inherit;
}

button:active{
    transform:scale(.97);
}

/* =========================================================
   SPECIAL BACKGROUNDS
   ========================================================= */

body::before,
body::after{
    content:"";
    position:fixed;
    pointer-events:none;
    z-index:-5;
    transition:opacity .5s ease;
}

body::before{
    width:650px;
    height:650px;

    left:-250px;
    top:-250px;

    border-radius:50%;

    background:radial-gradient(
        circle,
        var(--glow),
        transparent 68%
    );

    filter:blur(20px);
}

body::after{
    width:550px;
    height:550px;

    right:-250px;
    bottom:-250px;

    border-radius:50%;

    background:radial-gradient(
        circle,
        var(--glow),
        transparent 68%
    );

    filter:blur(25px);
}

/* =========================================================
   SAKURA PETALS
   ========================================================= */

.sakura-petals{
    position:fixed;
    inset:0;
    overflow:hidden;
    pointer-events:none;
    z-index:-2;
    display:none;
}

.theme-sakura .sakura-petals{
    display:block;
}

.petal{
    position:absolute;

    width:13px;
    height:18px;

    background:linear-gradient(
        135deg,
        #ffc1d4,
        #ed7fa2
    );

    border-radius:80% 20% 80% 20%;

    opacity:.7;

    filter:drop-shadow(
        0 3px 5px rgba(212,89,126,.15)
    );

    animation:
        petalFall linear infinite,
        petalRotate ease-in-out infinite;
}

.petal:nth-child(1){left:4%;animation-duration:11s;animation-delay:-2s}
.petal:nth-child(2){left:14%;animation-duration:14s;animation-delay:-8s}
.petal:nth-child(3){left:25%;animation-duration:10s;animation-delay:-4s}
.petal:nth-child(4){left:36%;animation-duration:16s;animation-delay:-12s}
.petal:nth-child(5){left:48%;animation-duration:12s;animation-delay:-6s}
.petal:nth-child(6){left:58%;animation-duration:15s;animation-delay:-10s}
.petal:nth-child(7){left:69%;animation-duration:11s;animation-delay:-7s}
.petal:nth-child(8){left:80%;animation-duration:17s;animation-delay:-13s}
.petal:nth-child(9){left:91%;animation-duration:13s;animation-delay:-5s}
.petal:nth-child(10){left:45%;animation-duration:18s;animation-delay:-15s}

@keyframes petalFall{
    from{
        transform:translateY(-10vh) translateX(0);
    }
    to{
        transform:translateY(115vh) translateX(100px);
    }
}

@keyframes petalRotate{
    0%,100%{
        rotate:0deg;
    }
    50%{
        rotate:180deg;
    }
}

/* =========================================================
   AURORA
   ========================================================= */

.aurora{
    display:none;
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:-3;
    overflow:hidden;
}

.theme-aurora .aurora{
    display:block;
}

.aurora::before,
.aurora::after{
    content:"";
    position:absolute;

    width:70vw;
    height:45vh;

    border-radius:50%;

    filter:blur(70px);

    opacity:.18;
}

.aurora::before{
    left:-10%;
    top:0;

    background:#28e79a;

    transform:rotate(-15deg);

    animation:auroraMove 10s ease-in-out infinite alternate;
}

.aurora::after{
    right:-10%;
    top:15%;

    background:#65a8ff;

    animation:auroraMove 14s ease-in-out infinite alternate-reverse;
}

@keyframes auroraMove{
    from{
        transform:translateY(-30px) rotate(-15deg);
    }
    to{
        transform:translateY(80px) rotate(18deg);
    }
}

/* =========================================================
   STARS
   ========================================================= */

.stars{
    display:none;
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:-3;
}

.theme-midnight .stars{
    display:block;
}

.star{
    position:absolute;
    width:2px;
    height:2px;
    background:white;
    border-radius:50%;
    opacity:.5;
    animation:twinkle 3s infinite alternate;
}

@keyframes twinkle{
    from{opacity:.15}
    to{opacity:.8}
}

/* =========================================================
   APP
   ========================================================= */

.app{
    width:100%;
    min-height:100vh;
}

.shell{
    width:min(1180px, calc(100% - 36px));
    margin:auto;
    padding-bottom:120px;
}

/* =========================================================
   HEADER
   ========================================================= */

.header{
    position:relative !important;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:30px 0 22px;

    z-index:1;
}

.brand{
    display:flex;
    align-items:center;
    gap:12px;
}

.logo{
    width:44px;
    height:44px;

    border-radius:15px;

    display:grid;
    place-items:center;

    background:
        linear-gradient(
            145deg,
            var(--primary),
            var(--primary-strong)
        );

    color:white;

    font-size:17px;
    font-weight:900;

    box-shadow:
        0 10px 25px var(--glow);
}

.brand-name{
    font-size:20px;
    font-weight:850;
    letter-spacing:-.6px;
}

.brand-dot{
    color:var(--primary);
}

.header-actions{
    display:flex;
    gap:9px;
}

.icon-button{
    width:42px;
    height:42px;

    border-radius:14px;

    display:grid;
    place-items:center;

    background:var(--surface);
    border:1px solid var(--border);

    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);

    box-shadow:0 7px 22px rgba(0,0,0,.04);

    transition:var(--transition);
}

.icon-button:hover{
    transform:translateY(-2px);
    box-shadow:0 12px 28px var(--glow);
}

/* =========================================================
   MAIN
   ========================================================= */

main{
    animation:pageEnter .35s ease;
}

@keyframes pageEnter{
    from{
        opacity:0;
        transform:translateY(7px);
    }
    to{
        opacity:1;
        transform:none;
    }
}

.page-heading{
    margin:18px 0 26px;
}

.page-heading h1{
    margin:0;

    font-size:clamp(30px,5vw,46px);
    letter-spacing:-1.8px;
    line-height:1.05;
}

.page-heading p{
    margin:9px 0 0;

    color:var(--muted);
    font-size:14px;
}

/* =========================================================
   CARDS
   ========================================================= */

.card{
    background:var(--surface);

    border:1px solid var(--border);

    border-radius:var(--radius);

    box-shadow:var(--shadow);

    backdrop-filter:blur(22px);
    -webkit-backdrop-filter:blur(22px);

    transition:
        transform var(--transition),
        box-shadow var(--transition),
        background .3s ease;
}

.card:hover{
    box-shadow:
        0 22px 55px rgba(0,0,0,.08),
        0 0 30px var(--glow);
}

.card-header{
    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:20px 22px 10px;
}

.card-title{
    font-weight:800;
    font-size:15px;
}

.card-body{
    padding:14px 22px 22px;
}

/* =========================================================
   TODAY
   ========================================================= */

.today-layout{
    display:grid;
    grid-template-columns:1.35fr .65fr;
    gap:20px;
}

.progress-card{
    padding:25px;
}

.progress-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.progress-label{
    color:var(--muted);
    font-size:13px;
}

.progress-number{
    font-size:34px;
    font-weight:850;
    letter-spacing:-1px;
}

.progress-track{
    height:10px;

    margin-top:20px;

    background:var(--surface-2);

    border-radius:100px;

    overflow:hidden;
}

.progress-bar{
    height:100%;
    width:0;

    border-radius:inherit;

    background:
        linear-gradient(
            90deg,
            var(--primary),
            var(--primary-strong)
        );

    box-shadow:0 0 18px var(--glow);

    transition:width .5s ease;
}

/* =========================================================
   HABIT ROWS
   ========================================================= */

.habit-list{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.habit-row{
    display:flex;
    align-items:center;
    gap:14px;

    padding:15px;

    border-radius:18px;

    background:rgba(127,127,127,.045);

    border:1px solid transparent;

    transition:var(--transition);
}

.habit-row:hover{
    background:var(--primary-soft);
    border-color:var(--border);
    transform:translateX(3px);
}

/* ROUND CHECKBOX */

.check{
    width:25px;
    height:25px;

    flex:0 0 25px;

    border-radius:50%;

    border:2px solid var(--muted);

    background:transparent;

    display:grid;
    place-items:center;

    transition:
        background .2s ease,
        border .2s ease,
        transform .2s ease;
}

.check:hover{
    border-color:var(--primary);
    transform:scale(1.08);
}

.check.done{
    border-color:var(--primary);
    background:var(--primary);
    color:white;
}

.check.done::after{
    content:"✓";
    font-size:14px;
    font-weight:900;
}

.habit-info{
    min-width:0;
    flex:1;
}

.habit-name{
    font-weight:700;
    font-size:14px;
}

.habit-meta{
    margin-top:3px;
    color:var(--muted);
    font-size:12px;
}

.category-pill{
    padding:6px 9px;

    border-radius:999px;

    background:var(--primary-soft);
    color:var(--primary-strong);

    font-size:10px;
    font-weight:750;
}

/* =========================================================
   BUTTONS
   ========================================================= */

.primary-button{
    min-height:44px;

    padding:0 17px;

    border-radius:15px;

    background:
        linear-gradient(
            135deg,
            var(--primary),
            var(--primary-strong)
        );

    color:white;

    font-weight:750;

    box-shadow:
        0 9px 24px var(--glow);

    transition:var(--transition);
}

.primary-button:hover{
    transform:translateY(-2px);
    box-shadow:
        0 14px 32px var(--glow);
}

.secondary-button{
    min-height:44px;

    padding:0 17px;

    border-radius:15px;

    background:var(--surface-2);

    color:var(--text);

    font-weight:700;

    border:1px solid var(--border);
}

/* =========================================================
   CALENDAR
   ========================================================= */

.calendar-card{
    padding:22px;
}

.calendar-head{
    display:flex;
    align-items:center;
    justify-content:space-between;

    margin-bottom:20px;
}

.calendar-month{
    font-size:18px;
    font-weight:800;
}

.calendar-arrows{
    display:flex;
    gap:7px;
}

.calendar-grid{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:7px;
}

.weekday{
    text-align:center;
    color:var(--muted);
    font-size:11px;
    font-weight:750;
    padding-bottom:5px;
}

.day{
    min-height:54px;

    border-radius:16px;

    background:transparent;

    position:relative;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:13px;
    font-weight:650;

    transition:var(--transition);
}

.day:hover{
    background:var(--primary-soft);
}

.day.selected{
    background:var(--primary);
    color:white;

    box-shadow:
        0 8px 22px var(--glow);
}

.day.today:not(.selected)::after{
    content:"";

    position:absolute;

    width:5px;
    height:5px;

    border-radius:50%;

    background:var(--primary);

    bottom:7px;
}

.day-dots{
    position:absolute;

    bottom:5px;

    display:flex;
    gap:3px;
}

.day-dot{
    width:4px;
    height:4px;

    border-radius:50%;

    background:var(--primary);
}

.selected .day-dot{
    background:white;
}

/* =========================================================
   HABITS PAGE
   ========================================================= */

.habits-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

.habit-card{
    padding:20px;

    position:relative;
    overflow:hidden;
}

.habit-card::before{
    content:"";

    position:absolute;

    width:120px;
    height:120px;

    right:-55px;
    top:-55px;

    border-radius:50%;

    background:var(--glow);
}

.habit-card-top{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;

    gap:15px;
}

.habit-card h3{
    margin:0;
    font-size:16px;
}

.habit-card p{
    margin:7px 0 0;

    color:var(--muted);
    font-size:12px;
}

.habit-actions{
    display:flex;
    gap:6px;
}

.small-icon{
    width:34px;
    height:34px;

    border-radius:11px;

    background:var(--surface-2);

    display:grid;
    place-items:center;

    border:1px solid var(--border);
}

/* =========================================================
   STATS
   ========================================================= */

.stats-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
}

.stat-card{
    padding:22px;
}

.stat-label{
    color:var(--muted);
    font-size:12px;
}

.stat-value{
    margin-top:8px;

    font-size:30px;
    font-weight:850;
}

.chart{
    height:190px;

    display:flex;
    align-items:flex-end;

    gap:10px;

    padding:15px 4px 0;
}

.chart-column{
    flex:1;

    height:100%;

    display:flex;
    align-items:flex-end;
}

.chart-bar{
    width:100%;

    min-height:5px;

    border-radius:9px 9px 4px 4px;

    background:
        linear-gradient(
            180deg,
            var(--primary),
            var(--primary-strong)
        );

    box-shadow:0 4px 16px var(--glow);

    transition:height .5s ease;
}

/* =========================================================
   SETTINGS / HELP
   ========================================================= */

.settings-list,
.help-list{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.setting-row,
.help-row{
    padding:17px 18px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:15px;

    background:rgba(127,127,127,.045);

    border-radius:18px;

    border:1px solid var(--border);
}

.setting-title,
.help-title{
    font-weight:750;
}

.setting-description,
.help-description{
    color:var(--muted);
    font-size:12px;
    margin-top:4px;
    line-height:1.5;
}

/* =========================================================
   THEME SELECTOR
   ========================================================= */

.themes-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
}

.theme-preview{
    min-height:105px;

    border-radius:19px;

    position:relative;
    overflow:hidden;

    cursor:pointer;

    border:2px solid transparent;

    transition:var(--transition);
}

.theme-preview:hover{
    transform:translateY(-4px);
}

.theme-preview.active{
    border-color:var(--primary);

    box-shadow:
        0 0 0 4px var(--primary-soft),
        0 14px 35px var(--glow);
}

.theme-preview span{
    position:absolute;

    left:12px;
    bottom:10px;

    color:white;

    font-size:11px;
    font-weight:800;

    text-shadow:0 2px 8px rgba(0,0,0,.45);
}

.preview-sage{
    background:linear-gradient(135deg,#dff2e4,#6eae83);
}

.preview-sakura{
    background:
        radial-gradient(circle at 20% 25%,#ffc3d7 0 5%,transparent 6%),
        radial-gradient(circle at 75% 35%,#f08cab 0 4%,transparent 5%),
        linear-gradient(135deg,#fff0f5,#d96d90);
}

.preview-ocean{
    background:linear-gradient(135deg,#d7f3f8,#398fa4);
}

/* =========================================================
   MODAL
   ========================================================= */

.modal-overlay{
    position:fixed;
    inset:0;

    background:rgba(0,0,0,.42);

    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);

    display:none;
    align-items:center;
    justify-content:center;

    padding:18px;

    z-index:100;
}

.modal-overlay.open{
    display:flex;
}

.modal{
    width:min(520px,100%);
    max-height:90vh;
    overflow:auto;

    padding:24px;

    border-radius:28px;

    background:var(--surface-solid);

    border:1px solid var(--border);

    box-shadow:
        0 30px 100px rgba(0,0,0,.25);

    animation:modalIn .25s ease;
}

@keyframes modalIn{
    from{
        opacity:0;
        transform:translateY(15px) scale(.97);
    }
    to{
        opacity:1;
        transform:none;
    }
}

.modal h2{
    margin:0 0 20px;
}

.form-group{
    margin-bottom:15px;
}

.form-group label{
    display:block;

    margin-bottom:7px;

    color:var(--muted);

    font-size:12px;
    font-weight:700;
}

.form-group input,
.form-group select,
.form-group textarea{
    width:100%;

    border:1px solid var(--border);

    border-radius:15px;

    background:var(--surface-2);

    color:var(--text);

    padding:13px 14px;

    outline:none;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus{
    border-color:var(--primary);
    box-shadow:0 0 0 4px var(--primary-soft);
}

.modal-actions{
    display:flex;
    justify-content:flex-end;
    gap:9px;

    margin-top:20px;
}

/* =========================================================
   PREMIUM BOTTOM NAV
   ========================================================= */

.bottom-nav{
    position:fixed;

    left:50%;

    bottom:
        calc(
            14px + env(safe-area-inset-bottom)
        );

    transform:translateX(-50%);

    width:min(
        760px,
        calc(100% - 24px)
    );

    min-height:70px;

    padding:7px;

    display:flex;
    align-items:center;

    gap:4px;

    background:var(--nav-bg);

    border:1px solid rgba(255,255,255,.16);

    border-radius:27px;

    box-shadow:
        0 18px 55px rgba(0,0,0,.14),
        0 3px 12px rgba(0,0,0,.06);

    backdrop-filter:blur(28px) saturate(150%);
    -webkit-backdrop-filter:blur(28px) saturate(150%);

    z-index:90;
}

.bottom-nav::before{
    content:"";

    position:absolute;
    inset:0;

    border-radius:inherit;

    pointer-events:none;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.16),
            transparent 45%
        );
}

.nav-item{
    position:relative;

    flex:1;

    min-width:0;

    height:56px;

    border-radius:20px;

    display:flex;
    align-items:center;
    justify-content:center;

    gap:7px;

    background:transparent;

    color:var(--muted);

    transition:
        color .25s ease,
        background .25s ease,
        transform .25s ease;
}

.nav-icon{
    width:21px;
    height:21px;

    display:grid;
    place-items:center;

    transition:
        transform .3s cubic-bezier(.2,.8,.2,1);
}

.nav-icon svg{
    width:20px;
    height:20px;

    stroke:currentColor;

    stroke-width:1.8;

    fill:none;

    stroke-linecap:round;
    stroke-linejoin:round;
}

.nav-label{
    max-width:0;
    overflow:hidden;

    white-space:nowrap;

    font-size:11px;
    font-weight:800;

    opacity:0;

    transition:
        max-width .3s ease,
        opacity .2s ease;
}

.nav-item.active{
    color:var(--primary-strong);

    background:var(--primary-soft);
}

.nav-item.active .nav-icon{
    transform:translateY(-1px);
}

.nav-item.active .nav-label{
    max-width:80px;
    opacity:1;
}

.nav-item:hover{
    color:var(--primary);
}

.nav-item:active{
    transform:scale(.95);
}

/* =========================================================
   TOAST
   ========================================================= */

.toast{
    position:fixed;

    left:50%;
    bottom:105px;

    transform:
        translate(-50%,20px)
        scale(.95);

    padding:12px 17px;

    border-radius:15px;

    background:var(--surface-solid);

    border:1px solid var(--border);

    box-shadow:0 15px 45px rgba(0,0,0,.15);

    font-size:12px;
    font-weight:750;

    opacity:0;

    pointer-events:none;

    transition:.25s ease;

    z-index:200;
}

.toast.show{
    opacity:1;

    transform:
        translate(-50%,0)
        scale(1);
}

/* =========================================================
   EMPTY
   ========================================================= */

.empty{
    padding:35px 20px;

    text-align:center;

    color:var(--muted);

    font-size:13px;
}

.empty-icon{
    width:52px;
    height:52px;

    margin:0 auto 12px;

    border-radius:18px;

    display:grid;
    place-items:center;

    background:var(--primary-soft);

    color:var(--primary);

    font-size:22px;
}

/* =========================================================
   RESPONSIVE
   ========================================================= */

@media(max-width:800px){

    .shell{
        width:min(100% - 24px, 650px);
        padding-bottom:125px;
    }

    .header{
        padding-top:18px;
    }

    .today-layout{
        grid-template-columns:1fr;
    }

    .habits-grid{
        grid-template-columns:1fr;
    }

    .stats-grid{
        grid-template-columns:1fr 1fr;
    }

    .themes-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .bottom-nav{
        width:calc(100% - 18px);
        min-height:68px;
        bottom:calc(8px + env(safe-area-inset-bottom));
    }

    .nav-item{
        height:54px;
    }

    .nav-label{
        display:none;
    }

    .nav-item.active .nav-label{
        display:none;
    }

    .nav-item.active{
        background:var(--primary-soft);
    }

    .nav-item.active .nav-icon{
        transform:scale(1.08);
    }

    .calendar-grid{
        gap:4px;
    }

    .day{
        min-height:47px;
        border-radius:13px;
    }
}

@media(max-width:500px){

    .page-heading{
        margin-top:10px;
    }

    .page-heading h1{
        font-size:32px;
    }

    .stats-grid{
        grid-template-columns:1fr;
    }

    .themes-grid{
        grid-template-columns:1fr 1fr;
    }

    .progress-card,
    .calendar-card,
    .help-section{
        padding:18px;
    }

    .card-header{
        padding:17px 18px 8px;
    }

    .card-body{
        padding:10px 18px 18px;
    }

    .bottom-nav{
        border-radius:24px;
    }
}

/* =========================================================

@media(min-width:801px){

        max-width:100px;

    }

    }
}

/* =========================================================

@media(prefers-reduced-motion:reduce){

    *::before,
    *::after{
        animation-duration:.01ms !important;
        animation-iteration-count:1 !important;
        transition-duration:.01ms !important;

}

<script>

/* =========================================================
   STORAGE
   ========================================================= */

const HABITS_KEY = "habitsPremiumHabits";
const THEME_KEY = "habitsPremiumTheme";

let habits = JSON.parse(
    localStorage.getItem(HABITS_KEY) || "[]"
);

let currentPage = "today";

let currentDate = new Date();

let calendarDate = new Date(
    currentDate.getFullYear(),
    currentDate.getMonth(),
    1
);

let selectedTheme =
    localStorage.getItem(THEME_KEY) || "sage";


/* =========================================================
   HELPERS
   ========================================================= */

function saveHabits(){

    localStorage.setItem(
        HABITS_KEY,
        JSON.stringify(habits)
    );

}

function saveTheme(){

    localStorage.setItem(
        THEME_KEY,
        selectedTheme
    );

}

function uid(){

    return Date.now().toString(36) +
        Math.random().toString(36).slice(2);

}

function sameDay(a,b){

    return (
        a.getFullYear() === b.getFullYear() &&
        a.getMonth() === b.getMonth() &&
        a.getDate() === b.getDate()
    );

}

function dateKey(date){

    const y = date.getFullYear();

    const m = String(
        date.getMonth()+1
    ).padStart(2,"0");

    const d = String(
        date.getDate()
    ).padStart(2,"0");

    return `${y}-${m}-${d}`;

}

function capitalize(str){

    return str.charAt(0).toUpperCase() + str.slice(1);

}

function formatDate(date){

    return new Intl.DateTimeFormat(
        "fr-BE",
        {
            weekday:"long",
            day:"numeric",
            month:"long"
        }
    ).format(date);

}

function monthName(date){

    return capitalize(
        new Intl.DateTimeFormat(
            "fr-BE",
            {
                month:"long",
                year:"numeric"
            }
        ).format(date)
    );

}

function showToast(message){

    const toast =
        document.getElementById("toast");

    toast.textContent = message;

    toast.classList.add("show");

    clearTimeout(window.toastTimer);

    window.toastTimer = setTimeout(()=>{
        toast.classList.remove("show");
    },2200);

}


/* =========================================================
   THEME
   ========================================================= */

function applyTheme(){

    document.body.className =
        "theme-" + selectedTheme;

    saveTheme();

}

applyTheme();


/* =========================================================
   NAVIGATION
   ========================================================= */

document
    .querySelectorAll(".nav-item")
    .forEach(button => {

        button.addEventListener("click",()=>{

            currentPage =
                button.dataset.page;

            document
                .querySelectorAll(".nav-item")
                .forEach(item =>
                    item.classList.toggle(
                        "active",
                        item === button
                    )
                );

            render();

            window.scrollTo({
                top:0,
                behavior:"smooth"
            });

        });

    });


function goToPage(page){

    currentPage = page;

    document
        .querySelectorAll(".nav-item")
        .forEach(item => {

            item.classList.toggle(
                "active",
                item.dataset.page === page
            );

        });

    render();

}


/* =========================================================
   RENDER
   ========================================================= */

function render(){

    const app =
        document.getElementById("app");

    if(currentPage === "today")
        app.innerHTML = renderToday();

    if(currentPage === "calendar")
        app.innerHTML = renderCalendar();

    if(currentPage === "habits")
        app.innerHTML = renderHabits();

    if(currentPage === "stats")
        app.innerHTML = renderStats();

    if(currentPage === "settings")
        app.innerHTML = renderSettings();

    if(currentPage === "help")
        app.innerHTML = renderHelp();

    attachEvents();

}


/* =========================================================
   TODAY
   ========================================================= */

function renderToday(){

    const today = new Date();

    const isToday =
        sameDay(currentDate,today);

    const completed =
        habits.filter(h =>
            h.completions?.includes(
                dateKey(currentDate)
            )
        ).length;

    const total = habits.length;

    const percentage =
        total ?
        Math.round((completed / total)*100)
        : 0;

    const title =
        isToday
        ? "Aujourd’hui"
        : capitalize(formatDate(currentDate));

    const subtitle =
        isToday
        ? capitalize(formatDate(currentDate))
        : "Journée sélectionnée";

    return `

        <div class="page-heading">

            <h1>
                ${title}
            </h1>

            <p>
                ${subtitle}
            </p>

        </div>


        <div class="today-layout">

            <section class="card progress-card">

                <div class="progress-top">

                    <div>

                        <div class="progress-label">
                            Progression
                        </div>

                        <div class="progress-number">
                            ${percentage}%
                        </div>

                    </div>

                    <div class="category-pill">
                        ${completed}/${total}
                    </div>

                </div>

                <div class="progress-track">

                    <div
                        class="progress-bar"
                        style="width:${percentage}%"
                    ></div>

                </div>

            </section>


            <section class="card">

                <div class="card-header">

                    <span class="card-title">
                        Résumé
                    </span>

                </div>

                <div class="card-body">

                    <div class="setting-row">

                        <div>
                            <div class="setting-title">
                                ${total}
                            </div>
                            <div class="setting-description">
                                habitudes
                            </div>
                        </div>

                        <span>
                            ✦
                        </span>

                    </div>

                </div>

            </section>

        </div>


        <div style="height:18px"></div>


        <section class="card">

            <div class="card-header">

                <span class="card-title">
                    Tes habitudes
                </span>

                <button
                    class="primary-button"
                    id="addHabitButton"
                >
                    + Ajouter
                </button>

            </div>

            <div class="card-body">

                ${
                    habits.length
                    ?
                    `<div class="habit-list">

                        ${habits.map(h => {

                            const done =
                                h.completions?.includes(
                                    dateKey(currentDate)
                                );

                            return `

                            <div class="habit-row">

                                <button
                                    class="check ${done ? "done" : ""}"
                                    data-toggle="${h.id}"
                                ></button>

                                <div class="habit-info">

                                    <div class="habit-name">
                                        ${escapeHtml(h.name)}
                                    </div>

                                    <div class="habit-meta">
                                        ${h.frequency} fois / semaine
                                    </div>

                                </div>

                                <span class="category-pill">
                                    ${escapeHtml(h.category)}
                                </span>

/* =========================================================
   CALENDAR
   ========================================================= */

function renderCalendar(){

    const year =
        calendarDate.getFullYear();

    const month =
        calendarDate.getMonth();

    const first =
        new Date(year,month,1);

    const last =
        new Date(year,month+1,0);

    let start =
        first.getDay();

    start =
        start === 0 ? 6 : start - 1;

    let cells = "";

    const days = [
        "L","M","M","J","V","S","D"
    ];

    cells += days.map(day =>
        `<div class="weekday">${day}</div>`
    ).join("");

    for(let i=0;i<start;i++){

        cells += `<div></div>`;

    }

    for(let d=1;d<=last.getDate();d++){

        const date =
            new Date(year,month,d);

        const selected =
            sameDay(date,currentDate);

        const today =
            sameDay(date,new Date());

        const key =
            dateKey(date);

        const completed =
            habits.some(h =>
                h.completions?.includes(key)
            );

        cells += `

            <button
                class="day
                    ${selected ? "selected" : ""}
                    ${today ? "today" : ""}
                "
                data-date="${key}"
            >

                ${d}

                ${
                    completed
                    ?
                    `<span class="day-dots">
                        <span class="day-dot"></span>
                    </span>`
                    :
                    ""
                }

            </button>

        `;

    }

    return `

        <div class="page-heading">

            <h1>
                Calendrier
            </h1>

            <p>
                Visualise ta régularité.
            </p>

        </div>


        <section class="card calendar-card">

            <div class="calendar-head">

                <button
                    class="secondary-button"
                    id="prevMonth"
                >
                    ‹
                </button>

                <div class="calendar-month">
                    ${monthName(calendarDate)}
                </div>

                <button
                    class="secondary-button"
                    id="nextMonth"
                >
                    ›
                </button>

            </div>

            <div class="calendar-grid">

                ${cells}

            </div>

        </section>

    `;

}

/* =========================================================

   ========================================================= */

function renderStats(){

    const totalCompletions =
        habits.reduce(
            (sum,h) =>
                sum + (h.completions?.length || 0),
            0
        );

    const active =
        habits.length;

    const last7 = [];

    for(let i=6;i>=0;i--){

        const d = new Date();

        d.setDate(
            d.getDate()-i
        );

        const key =
            dateKey(d);

        const count =
            habits.filter(h =>
                h.completions?.includes(key)
            ).length;

        last7.push({
            date:d,
            count
        });

    }

    const max =
        Math.max(
            1,
            ...last7.map(x=>x.count)
        );

    return `

        <div class="page-heading">

            <h1>
                Statistiques
            </h1>

            <p>
                Comprends ta régularité.
            </p>

        </div>


        <div class="stats-grid">

            <section class="card stat-card">

                <div class="stat-label">

                <div class="stat-value">
                    ${active}
                </div>

            </section>


            <section class="card stat-card">

                <div class="stat-label">
                    Complétions
                </div>

                <div class="stat-value">
                    ${totalCompletions}
                </div>

            </section>


            <section class="card stat-card">

                <div class="stat-label">
                    Jours suivis
                </div>

                <div class="stat-value">
                    ${new Set(
                        habits.flatMap(
                            h => h.completions || []

                    ).size}
                </div>

            </section>

        </div>


        <div style="height:15px"></div>


        <section class="card">

            <div class="card-header">

                <span class="card-title">
                    7 derniers jours
                </span>

            </div>

            <div class="card-body">

                <div class="chart">

                    ${last7.map(x => `

                        <div class="chart-column">

                            <div
                                class="chart-bar"
                                style="

                                        5,

                    `).join("")}

                </div>

            </div>

        </section>

    `;

}

/* =========================================================
   ESCAPE
   ========================================================= */

function escapeHtml(value){

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


/* =========================================================
   EVENTS
   ========================================================= */

function attachEvents(){

    /* ADD */

    document
        .querySelectorAll("#addHabitButton")
        .forEach(button => {

            button.onclick =
                openHabitModal;

        });


    /* CHECK */

    document
        .querySelectorAll("[data-toggle]")
        .forEach(button => {

            button.onclick = () => {

                const id =
                    button.dataset.toggle;

                const habit =
                    habits.find(h =>
                        h.id === id
                    );

                if(!habit) return;

                if(!habit.completions)
                    habit.completions = [];

                const key =
                    dateKey(currentDate);

                if(
                    habit.completions
                        .includes(key)
                ){

                    habit.completions =
                        habit.completions
                            .filter(x => x !== key);

                }else{

                    habit.completions.push(key);

                }

                saveHabits();

                render();

            };

        });


    /* DELETE */

    document
        .querySelectorAll("[data-delete]")
        .forEach(button => {

            button.onclick = () => {

                const id =
                    button.dataset.delete;

                habits =
                    habits.filter(
                        h => h.id !== id
                    );

                saveHabits();

                render();

                showToast(
                    "Habitude supprimée"
                );

            };

        });


    /* CALENDAR */

    document
        .querySelectorAll("[data-date]")
        .forEach(button => {

            button.onclick = () => {

                const [y,m,d] =
                    button.dataset.date
                        .split("-")
                        .map(Number);

                currentDate =
                    new Date(y,m-1,d);

                calendarDate =
                    new Date(y,m-1,1);

                goToPage("today");

            };

        });


    const previous =
        document.getElementById("prevMonth");

    if(previous){

        previous.onclick = () => {

            calendarDate =
                new Date(
                    calendarDate.getFullYear(),
                    calendarDate.getMonth()-1,
                    1
                );

            render();

        };

    }


    const next =
        document.getElementById("nextMonth");

    if(next){

        next.onclick = () => {

            calendarDate =
                new Date(
                    calendarDate.getFullYear(),
                    calendarDate.getMonth()+1,
                    1
                );

            render();

        };

    }


    /* THEMES */

    document
        .querySelectorAll("[data-theme]")
        .forEach(button => {

            button.onclick = () => {

                selectedTheme =
                    button.dataset.theme;

                applyTheme();

                render();

                showToast(
                    "Thème appliqué"
                );

            };

        });


    /* HELP */

    document
        .querySelectorAll("[data-help]")
        .forEach(button => {

            button.onclick = () => {

                document
                    .querySelectorAll("[data-help]")
                    .forEach(x =>
                        x.classList.remove("active")
                    );

                button.classList.add("active");

                document
                    .getElementById("helpContent")
                    .innerHTML =
                    helpContent(
                        button.dataset.help
                    );

                attachHelpEvents();

            };

        });


    if(
        document.getElementById("helpContent")
    ){

        document
            .getElementById("helpContent")
            .innerHTML =
            helpContent("general");

        attachHelpEvents();

    }

}


/* =========================================================
   HELP EVENTS
   ========================================================= */

function attachHelpEvents(){

    document
        .querySelectorAll("[data-open-help]")
        .forEach(button => {

                document

/* =========================================================

   ========================================================= */

document
    .getElementById("habitForm")
    .addEventListener(
        "submit",

            const name =
                document
                    .getElementById("habitName")
                    .value
                    .trim();

                document
                    .getElementById("habitCategory")

                        Number(

                completions:[]

            closeHabitModal();

            event.target.reset();

                .getElementById(

                )
                .value = 3;

            render();

            showToast(
                "Habitude créée"
